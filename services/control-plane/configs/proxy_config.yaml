# Shahrah Configuration
# Environment variables are referenced using ${ENV_VAR} syntax

router_settings:
  routing_strategy: simple-shuffle
  redis_host: ${REDIS_HOST}
  redis_port: 6379
  redis_password: ${REDIS_PASSWORD}
  cooldown_time: 60
  num_retries: 3

# Opt-in gateway response caching. The ArvanCloud URL can contain an opaque
# credential-like path and must only be supplied through runtime secrets.
response_cache:
  enabled: true
  key_prefix: "shahrah:response-cache"
  default_ttl_seconds: 600
  min_ttl_seconds: 1
  max_ttl_seconds: 86400
  max_response_bytes: 1048576
  max_semantic_candidates: 500
  embedding_provider: "arvancloud"
  embedding_model: "Bge-m3"
  embedding_revision: "v1"
  embedding_base_url: ${SHAHRAH_SMART_CACHE_EMBEDDING_BASE_URL}
  embedding_api_key: ${SHAHRAH_SMART_CACHE_EMBEDDING_API_KEY}
  embedding_dimensions: 1024
  embedding_timeout_seconds: 10
  embedding_max_batch_size: 16

tenant_settings:
  allow_header_hint: true

tunnel_settings:
  client_url: ${TUNNEL_CLIENT_URL}
  timeout_seconds: 300

billing_settings:
  default_usd_to_irr: 850000
  rate_source: "nobitex"

general_settings:
  master_key: ${MASTER_KEY}
  database_url: ${DATABASE_URL}
  host: "0.0.0.0"
  port: 4000

