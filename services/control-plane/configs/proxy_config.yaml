# Shahrah Configuration
# Environment variables are referenced using ${ENV_VAR} syntax

model_list:
  # OpenAI GPT-3.5-Turbo
  - model_name: gpt-3.5-turbo
    litellm_params:
      model: openai/gpt-3.5-turbo
      api_key: ${OPENAI_API_KEY}
      rpm: 1000
      timeout: 60
    model_info:
      id: "openai-gpt35-1"
      health_check_timeout: 30

  # OpenAI GPT-4
  - model_name: gpt-4
    litellm_params:
      model: openai/gpt-4
      api_key: ${OPENAI_API_KEY}
      rpm: 500
      timeout: 120
    model_info:
      id: "openai-gpt4-1"
      health_check_timeout: 30

  # Wildcard: any openai model
  - model_name: "*"
    litellm_params:
      model: openai/*
      api_key: ${OPENAI_API_KEY}

router_settings:
  routing_strategy: simple-shuffle
  redis_host: ${REDIS_HOST}
  redis_port: 6379
  redis_password: ${REDIS_PASSWORD}
  enable_pre_call_checks: true
  cooldown_time: 60
  num_retries: 3

general_settings:
  master_key: ${MASTER_KEY}
  database_url: ${DATABASE_URL}
  host: "0.0.0.0"
  port: 4000
  proxy_batch_write_at: 1
  database_connection_pool_limit: 10

