version: "2"

run:
  timeout: 5m
  issues-exit-code: 1
  tests: true
  allow-parallel-runners: true
  build-tags: []

linters:
  default: none
  enable:
    - bodyclose
    - dupl
    - errcheck
    - gocritic
    - gocyclo
    - godot
    - govet
    - ineffassign
    - lll
    - makezero
    - misspell
    - nilerr
    - nolintlint
    - prealloc
    - revive
    - staticcheck
    - tparallel
    - unconvert
    - unused
    - wastedassign
    - whitespace
    - wsl_v5
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    govet:
      enable:
        - shadow
    misspell:
      locale: US
    godot:
      scope: declarations
      period: true
      capital: false
    gocritic:
      enabled-checks: []
      disabled-checks:
        - unnamedResult
      enabled-tags:
        - diagnostic
        - style
        - performance
        - experimental
        - opinionated
    revive:
      severity: warning
      rules:
        - name: exported
        - name: if-return
        - name: var-declaration
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unused-parameter
        - name: unreachable-code
        - name: redefines-builtin-id
    gocyclo:
      min-complexity: 15
    lll:
      line-length: 150
      tab-width: 4
    makezero:
      always: false
    prealloc:
      simple: true
      range-loops: true
      for-loops: false
  exclusions:
    generated: disable
    rules:
      - path: _test\.go
        linters:
          - dupl
          - errcheck
          - gocyclo
      - linters:
          - lll
        source: "^//go:"
      - linters:
          - lll
        source: "^//.*"

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/BerriAI/go-llm-proxy

issues:
  max-same-issues: 10
  max-issues-per-linter: 50
