network:
  version: 2
  renderer: networkd
  ethernets:
    eth0:
      match:
        macaddress: fa:16:3e:5a:d5:79
      set-name: eth0
      addresses:
        - 10.10.0.190/24
      dhcp4: false
      dhcp6: false
    eth1:
      match:
        macaddress: fa:16:3e:5f:7f:a3
      set-name: eth1
      dhcp4: true
      dhcp4-overrides:
        route-metric: 100
        use-routes: true
        use-dns: true
      dhcp6: false
      optional: true

