#!/usr/sbin/nft -f

flush ruleset

table inet filter {
    chain input {
        type filter hook input priority filter; policy accept;

		ct state established,related counter accept comment "allow established input"
		iifname "lo" counter accept comment "allow loopback input"
		ip saddr { 10.10.0.21, 10.10.0.22, 10.10.0.23 } tcp dport 1443 counter accept comment "allow K3s nodes to EU egress proxy"
		tcp dport 1443 counter drop comment "deny other EU egress proxy clients"
    }

    chain forward {
        type filter hook forward priority filter; policy drop;

        ct state invalid counter drop comment "drop invalid forwarded traffic"
        ct state established,related counter accept comment "allow established forwarded traffic"
        iifname "eth1" oifname "eth0" ct state new counter drop comment "block new public-to-private forwarding"
        iifname "eth0" oifname "eth1" ip saddr { 10.10.0.21, 10.10.0.22, 10.10.0.23 } ip daddr != 10.10.0.0/24 ct state new counter accept comment "allow K3s node egress"
        counter drop comment "drop all other forwarded traffic"
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}

table ip nat {
    chain postrouting {
        type nat hook postrouting priority srcnat; policy accept;
        oifname "eth1" ip saddr { 10.10.0.21, 10.10.0.22, 10.10.0.23 } counter masquerade comment "SNAT K3s node egress"
    }
}

