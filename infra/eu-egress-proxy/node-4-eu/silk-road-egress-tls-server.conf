foreground = yes
syslog = no
debug = notice

[silk-road-egress]
accept = 130.185.121.142:443
connect = 127.0.0.1:443
cert = /etc/silk-road-egress-tls/server.crt
key = /etc/silk-road-egress-tls/server.key
CAfile = /etc/silk-road-egress-tls/ca.crt
verifyChain = yes
requireCert = yes
sslVersionMin = TLSv1.2
sslVersionMax = TLSv1.3
TIMEOUTconnect = 10
TIMEOUTidle = 43200
socket = l:SO_KEEPALIVE=1
socket = r:SO_KEEPALIVE=1
