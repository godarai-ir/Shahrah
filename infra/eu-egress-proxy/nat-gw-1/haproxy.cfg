global
    log stdout format raw local0
    maxconn 2048
    user haproxy
    group haproxy
    ssl-default-server-options ssl-min-ver TLSv1.2

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 10s
    timeout client 12h
    timeout server 12h
    timeout tunnel 12h

frontend silk_road_local_proxy
    bind 127.0.0.1:15443
    default_backend eu_egress_proxy

backend eu_egress_proxy
    option tcp-check
    tcp-check send "CONNECT www.cloudflare.com:443 HTTP/1.1\r\nHost: www.cloudflare.com:443\r\n\r\n"
    tcp-check expect string "HTTP/1.1 200"
    server node-4-eu 130.185.121.142:443 ssl verify required verifyhost node-4-eu ca-file /etc/haproxy/certs/egress-ca.crt crt /etc/haproxy/certs/nat-gw-1.pem sni str(node-4-eu) check inter 30s fall 2 rise 2
