apiVersion: batch/v1
kind: Job
metadata:
  name: migrate-main-db
  namespace: shahrah-local
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: migrate-main-db
    spec:
      imagePullSecrets:
        - name: regcred
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done
      containers:
        - name: goose
          image: shahrah/goose:local
          imagePullPolicy: IfNotPresent
          workingDir: /migrations
          command:
            - goose
            - postgres
            - postgresql://postgres:postgres@postgres:5432/sharah_db?sslmode=disable
            - up
          volumeMounts:
            - name: migrations
              mountPath: /migrations
      volumes:
        - name: migrations
          configMap:
            name: goose-migrations
---
apiVersion: batch/v1
kind: Job
metadata:
  name: model-discovery-migrate
  namespace: shahrah-local
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: model-discovery-migrate
    spec:
      imagePullSecrets:
        - name: regcred
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done
      containers:
        - name: model-discovery-migrate
          image: shahrah/model-discovery-migrate:local
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - >-
              pnpm exec prisma migrate deploy &&
              pnpm run import:providers:yaml --
              --providers anthropic,google-gemini,openai
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: shahrah-secret
                  key: MODEL_DISCOVERY_DATABASE_URL
---
apiVersion: batch/v1
kind: Job
metadata:
  name: support-admin-migrate
  namespace: shahrah-local
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: support-admin-migrate
    spec:
      imagePullSecrets:
        - name: regcred
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done
      containers:
        - name: support-admin-migrate
          image: shahrah/support-admin-migrate:local
          imagePullPolicy: IfNotPresent
          command:
            - pnpm
            - exec
            - prisma
            - migrate
            - deploy
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: shahrah-secret
                  key: SUPPORT_ADMIN_DATABASE_URL
