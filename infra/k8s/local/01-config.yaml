apiVersion: v1
kind: ConfigMap
metadata:
  name: shahrah-config
  namespace: shahrah-local
data:
  SHAHRAH_MODEL_DISCOVERY_URL: http://model-discovery:3002/api/v1
  MODEL_DISCOVERY_CORS_ORIGIN: http://localhost:3000,http://localhost:3001,http://localhost:4000
  MODEL_DISCOVERY_API_BASE_INTERNAL: http://model-discovery:3002/api/v1
  SUPPORT_ADMIN_ORIGIN: http://localhost:3001
  SHAHRAH_CONTROL_PLANE_URL: http://control-plane:4000
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  CLICKHOUSE_DB: sharah_db
  CLICKHOUSE_USER: sharah_user
  CLICKHOUSE_HTTP_PORT: "8123"
  CLICKHOUSE_NATIVE_PORT: "9000"
  METRICS_MODEL_ENABLED: "true"
  LOG_RETENTION_CLEANUP_ENABLED: "true"
  LOG_RETENTION_CLEANUP_INTERVAL_MS: "3600000"
  LOG_RETENTION_CLEANUP_TIMEOUT_MS: "30000"
  TYPESENSE_HOST: typesense
  TYPESENSE_PORT: "8108"
  TYPESENSE_PROTOCOL: http
  TYPESENSE_COLLECTION_MODELS: models
  TYPESENSE_READS_ENABLED: "true"
  TYPESENSE_READY_STRICT: "true"
  TYPESENSE_DATA_DIR: /data
  TYPESENSE_ENABLE_CORS: "true"
  SILK_ROAD_ADDR: :8083
  SILK_ROAD_URL: http://silk-road:8083
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  SMTP_FROM: no-reply@shahrah.local
  EMAIL_SENDING_ENABLED: "true"
  BALE_OTP_ENABLED: "false"
  BALE_SAFIR_BOT_ID: ""
  PGADMIN_DEFAULT_EMAIL: admin@example.com
