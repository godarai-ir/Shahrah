            - until nc -z tunnel-client 8081; do echo waiting for tunnel-client; sleep 2; done
        - name: wait-for-mailpit
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z mailpit 1025; do echo waiting for mailpit; sleep 2; done
      containers:
        - name: control-plane
          image: registry-def882af9a-shahrah-local.apps.ir-central1.arvancaas.ir/shahrah-local/control-plane:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
              name: http
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: shahrah-secret
                  key: DATABASE_URL
            - name: CLICKHOUSE_DSN
              valueFrom:
                secretKeyRef:
                  name: shahrah-secret
                  key: CLICKHOUSE_DSN
            - name: METRICS_MODEL_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: shahrah-config
                  key: METRICS_MODEL_ENABLED
            - name: LOG_RETENTION_CLEANUP_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: shahrah-config
                  key: LOG_RETENTION_CLEANUP_ENABLED
            - name: LOG_RETENTION_CLEANUP_INTERVAL_MS
              valueFrom:
                configMapKeyRef:
                  name: shahrah-config
                  key: LOG_RETENTION_CLEANUP_INTERVAL_MS
            - name: LOG_RETENTION_CLEANUP_TIMEOUT_MS
              valueFrom:
                configMapKeyRef:
                  name: shahrah-config
                  key: LOG_RETENTION_CLEANUP_TIMEOUT_MS
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: shahrah-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: shahrah-config
                  key: REDIS_PORT
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shahrah-secret
                  key: REDIS_PASSWORD
            - name: MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: shahrah-secret
                  key: MASTER_KEY
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: shahrah-secret
                  key: OPENAI_API_KEY
            - name: TUNNEL_CLIENT_URL
              valueFrom:
                configMapKeyRef:
                  name: shahrah-config
                  key: TUNNEL_CLIENT_URL
            - name: SHAHRAH_MODEL_DISCOVERY_URL
              valueFrom:
                configMapKeyRef:
                  name: shahrah-config
                  key: SHAHRAH_MODEL_DISCOVERY_URL
            - name: SHAHRAH_DISCOVERY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: shahrah-secret
                  key: SHAHRAH_DISCOVERY_TOKEN
            - name: EMAIL_SENDING_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: shahrah-config
                  key: EMAIL_SENDING_ENABLED
            - name: SMTP_HOST
              valueFrom:
                configMapKeyRef:
                  name: shahrah-config
                  key: SMTP_HOST
            - name: SMTP_PORT
              valueFrom:
                configMapKeyRef:
                  name: shahrah-config
                  key: SMTP_PORT
            - name: SMTP_FROM
              valueFrom:
                configMapKeyRef:
                  name: shahrah-config
                  key: SMTP_FROM
            - name: BALE_OTP_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: shahrah-config
                  key: BALE_OTP_ENABLED
            - name: BALE_SAFIR_API_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: shahrah-secret
                  key: BALE_SAFIR_API_ACCESS_KEY
            - name: BALE_SAFIR_BOT_ID
              valueFrom:
                configMapKeyRef:
                  name: shahrah-config
                  key: BALE_SAFIR_BOT_ID
          readinessProbe:
            tcpSocket:
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 4000
            initialDelaySeconds: 20
            periodSeconds: 10
---
