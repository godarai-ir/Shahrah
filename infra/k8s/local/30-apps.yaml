apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-discovery
  namespace: shahrah-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: model-discovery
  template:
    metadata:
      labels:
        app: model-discovery
    spec:
      imagePullSecrets:
        - name: regcred
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done
        - name: wait-for-redis
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z redis 6379; do echo waiting for redis; sleep 2; done
        - name: wait-for-typesense
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z typesense 8108; do echo waiting for typesense; sleep 2; done
      containers:
        - name: model-discovery
          image: registry-def882af9a-shahrah-local.apps.ir-central1.arvancaas.ir/shahrah-local/model-discovery:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3002
              name: http
          env:
            - name: PORT
              value: "3002"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: shahrah-secret
                  key: MODEL_DISCOVERY_DATABASE_URL
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: shahrah-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: shahrah-config
                  key: REDIS_PORT
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shahrah-secret
                  key: REDIS_PASSWORD
            - name: TYPESENSE_HOST
              valueFrom:
                configMapKeyRef:
                  name: shahrah-config
                  key: TYPESENSE_HOST
            - name: TYPESENSE_PORT
              valueFrom:
                configMapKeyRef:
                  name: shahrah-config
                  key: TYPESENSE_PORT
            - name: TYPESENSE_PROTOCOL
              valueFrom:
                configMapKeyRef:
                  name: shahrah-config
                  key: TYPESENSE_PROTOCOL
            - name: TYPESENSE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: shahrah-secret
                  key: TYPESENSE_API_KEY
            - name: TYPESENSE_COLLECTION_MODELS
              valueFrom:
                configMapKeyRef:
                  name: shahrah-config
                  key: TYPESENSE_COLLECTION_MODELS
            - name: TYPESENSE_READS_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: shahrah-config
                  key: TYPESENSE_READS_ENABLED
            - name: TYPESENSE_READY_STRICT
              valueFrom:
                configMapKeyRef:
                  name: shahrah-config
                  key: TYPESENSE_READY_STRICT
            - name: MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: shahrah-secret
                  key: MASTER_KEY
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: shahrah-secret
                  key: JWT_SECRET
            - name: CORS_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: shahrah-config
                  key: MODEL_DISCOVERY_CORS_ORIGIN
          readinessProbe:
            httpGet:
              path: /api/v1/ready
              port: 3002
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 3002
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: model-discovery
  namespace: shahrah-local
spec:
  selector:
    app: model-discovery
  ports:
    - name: http
      port: 3002
      targetPort: 3002
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane
  namespace: shahrah-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app: control-plane
  template:
    metadata:
      labels:
        app: control-plane
    spec:
      imagePullSecrets:
        - name: regcred
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
