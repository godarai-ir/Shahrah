services:
  control-plane:
    build:
      context: ../../
      dockerfile: services/control-plane/Dockerfile
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/sharah_db?sslmode=disable
      CLICKHOUSE_DSN: ${CLICKHOUSE_DSN:-clickhouse://sharah_user:5r74Fq90EyWA@clickhouse:9000/sharah_db?dial_timeout=5s&read_timeout=10s}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-s4M6gOMp77ss}
      MASTER_KEY: ${MASTER_KEY:-sk-dev-master-key-12345}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-provider-placeholder}
      TUNNEL_CLIENT_URL: http://tunnel-client:8081
      SHAHRAH_MODEL_DISCOVERY_URL: ${SHAHRAH_MODEL_DISCOVERY_URL:-http://silk-road:8083}
      SHAHRAH_DISCOVERY_TOKEN: ${SHAHRAH_DISCOVERY_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      tunnel-client:
        condition: service_started
    restart: unless-stopped

  tunnel-client:
    build:
      context: ../../
      dockerfile: services/tunnel-client/Dockerfile
    ports:
      - "8081:8081"
    environment:
      TUNNEL_CLIENT_ADDR: :8081
      TUNNEL_SERVER_URL: http://tunnel-server:8082
    depends_on:
      tunnel-server:
        condition: service_started
    restart: unless-stopped

  tunnel-server:
    build:
      context: ../../
      dockerfile: services/tunnel-server/Dockerfile
    ports:
      - "8082:8082"
    environment:
      TUNNEL_SERVER_ADDR: :8082
      SILK_ROAD_URL: http://silk-road:8083
    depends_on:
      silk-road:
        condition: service_started
    restart: unless-stopped

  silk-road:
    build:
      context: ../../
      dockerfile: services/silk-road/Dockerfile
    ports:
      - "8083:8083"
    environment:
      SILK_ROAD_ADDR: :8083
    restart: unless-stopped

  postgres:
    image: postgres:${POSTGRES_VERSION:-18}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sharah_db
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    image: pressly/goose:latest
    volumes:
      - ../../db/main/migrations:/migrations
    working_dir: /migrations
    command: ["postgres", "postgresql://postgres:postgres@postgres:5432/sharah_db?sslmode=disable", "up"]
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: sh -c 'if [ -n "$$REDIS_PASSWORD" ]; then exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"; else exec redis-server --appendonly yes; fi'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$$REDIS_PASSWORD\" ]; then redis-cli -a \"$$REDIS_PASSWORD\" ping; else redis-cli ping; fi"]
      interval: 5s
      timeout: 5s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:${CLICKHOUSE_VERSION:-24.8}
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    environment:
      CLICKHOUSE_DB: sharah_db
      CLICKHOUSE_USER: sharah_user
      CLICKHOUSE_PASSWORD: "5r74Fq90EyWA"
    volumes:
      - clickhousedata:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    ports:
      - "${PGADMIN_HOST_PORT:-5050}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  clickhousedata:
  pgadmin_data:
