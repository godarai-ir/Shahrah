services:
  control-plane:
    build:
      context: ../../
      dockerfile: services/control-plane/Dockerfile
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/sharah_db?sslmode=disable
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MASTER_KEY: ${MASTER_KEY:-sk-dev-master-key-12345}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-provider-placeholder}
      TUNNEL_CLIENT_URL: http://tunnel-client:8081
      SHAHRAH_MODEL_DISCOVERY_URL: ${SHAHRAH_MODEL_DISCOVERY_URL:-http://silk-road:8083}
      SHAHRAH_DISCOVERY_TOKEN: ${SHAHRAH_DISCOVERY_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      tunnel-client:
        condition: service_started
    restart: unless-stopped

  tunnel-client:
    build:
      context: ../../
      dockerfile: services/tunnel-client/Dockerfile
    ports:
      - "8081:8081"
    environment:
      TUNNEL_CLIENT_ADDR: :8081
      TUNNEL_SERVER_URL: http://tunnel-server:8082
    depends_on:
      tunnel-server:
        condition: service_started
    restart: unless-stopped

  tunnel-server:
    build:
      context: ../../
      dockerfile: services/tunnel-server/Dockerfile
    ports:
      - "8082:8082"
    environment:
      TUNNEL_SERVER_ADDR: :8082
      SILK_ROAD_URL: http://silk-road:8083
    depends_on:
      silk-road:
        condition: service_started
    restart: unless-stopped

  silk-road:
    build:
      context: ../../
      dockerfile: services/silk-road/Dockerfile
    ports:
      - "8083:8083"
    environment:
      SILK_ROAD_ADDR: :8083
    restart: unless-stopped

  postgres:
    image: postgres:${POSTGRES_VERSION:-18}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sharah_db
    volumes:
      - pgdata:/var/lib/postgresql
      - ../../db/main/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
