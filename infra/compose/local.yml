x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  control-plane:
    logging: *default-logging
    build:
      context: ../../
      dockerfile: services/control-plane/Dockerfile
      args:
        GOPROXY: ${GOPROXY:-https://goproxy.io,direct}
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/sharah_db?sslmode=disable
      CLICKHOUSE_DSN: ${CLICKHOUSE_DSN:-clickhouse://sharah_user:5r74Fq90EyWA@clickhouse:9000/sharah_db?dial_timeout=5s&read_timeout=10s}
      CLICKHOUSE_REQUIRED: "true"
      CLICKHOUSE_INIT_ATTEMPTS: ${CLICKHOUSE_INIT_ATTEMPTS:-10}
      CLICKHOUSE_INIT_RETRY_SECONDS: ${CLICKHOUSE_INIT_RETRY_SECONDS:-1}
      METRICS_MODEL_ENABLED: ${METRICS_MODEL_ENABLED:-true}
      PROFILING_ENABLE_PPROF: ${PROFILING_ENABLE_PPROF:-false}
      PROFILING_MUTEX_PROFILE_FRACTION: ${PROFILING_MUTEX_PROFILE_FRACTION:-0}
      PROFILING_BLOCK_PROFILE_RATE: ${PROFILING_BLOCK_PROFILE_RATE:-0}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-s4M6gOMp77ss}
      MASTER_KEY: ${MASTER_KEY:-sk-dev-master-key-12345}
      PLATFORM_PROVIDER_CREDENTIAL_MODE: ${PLATFORM_PROVIDER_CREDENTIAL_MODE:-platform_store}
      PLATFORM_PROVIDER_CREDENTIAL_ACTIVE_KEK_VERSION: ${PLATFORM_PROVIDER_CREDENTIAL_ACTIVE_KEK_VERSION:-local-v1}
      PLATFORM_PROVIDER_CREDENTIAL_KEKS_JSON: ${PLATFORM_PROVIDER_CREDENTIAL_KEKS_JSON:-{"local-v1":"QkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkI="}}
      PLATFORM_PROVIDER_CREDENTIAL_FINGERPRINT_KEY: ${PLATFORM_PROVIDER_CREDENTIAL_FINGERPRINT_KEY:-JCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQ=}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-provider-placeholder}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-sk-ant-provider-placeholder}
      TUNNEL_CLIENT_URL: http://tunnel-client:8081
      SHAHRAH_MODEL_DISCOVERY_URL: ${SHAHRAH_MODEL_DISCOVERY_URL:-http://model-discovery:3002/api/v1}
      SHAHRAH_DISCOVERY_TOKEN: ${SHAHRAH_DISCOVERY_TOKEN:-}
      EMAIL_SENDING_ENABLED: ${EMAIL_SENDING_ENABLED:-true}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-no-reply@shahrah.local}
      SUPPORT_S3_ENDPOINT: http://minio:9000
      SUPPORT_S3_REGION: us-east-1
      SUPPORT_S3_BUCKET: godarai-support
      SUPPORT_S3_ACCESS_KEY: ${SUPPORT_S3_ACCESS_KEY:-godarai-local}
      SUPPORT_S3_SECRET_KEY: ${SUPPORT_S3_SECRET_KEY:-godarai-local-secret}
      SUPPORT_S3_FORCE_PATH_STYLE: "true"
      SUPPORT_CLAMAV_ADDRESS: clamav:3310
      BALE_OTP_ENABLED: ${BALE_OTP_ENABLED:-false}
      BALE_SAFIR_API_ACCESS_KEY: ${BALE_SAFIR_API_ACCESS_KEY:-}
      BALE_SAFIR_BOT_ID: ${BALE_SAFIR_BOT_ID:-}
      RESPONSE_CACHE_ENABLED: "true"
      SHAHRAH_SMART_CACHE_EMBEDDING_BASE_URL: "${SHAHRAH_SMART_CACHE_EMBEDDING_BASE_URL:-https://arvancloudai.ir/gateway/models/Bge-m3/p805iFnyY2GwffdnMtgV3d0hdR4C-nSy41D61Y7C0TKUVxGYVmQ6YbYK9kAKibIaBNyKUXfBK1OBsLmRQZCSuPQaAtLKHXC3hAZNURaqqZ6Z4_vcvmpAioKQwgi57GiubEVMzFTMMCLD36C7q-XXz_ufyGgdmFRZ9Q-Eo--VtRiMfIvtXrOgfhuhosjg6xTqENVo1pIUsOwoPKed1crX8isrXULdccVWQ8Zgvlw0Aoar4w/v1}"
      SHAHRAH_SMART_CACHE_EMBEDDING_API_KEY: "${SHAHRAH_SMART_CACHE_EMBEDDING_API_KEY:-a7579f98-6348-5d37-93ed-3715845cacfa}"
      TENANT_PROVIDER_CREDENTIAL_ACTIVE_KEK_VERSION: ${TENANT_PROVIDER_CREDENTIAL_ACTIVE_KEK_VERSION}
      TENANT_PROVIDER_CREDENTIAL_KEKS_JSON: ${TENANT_PROVIDER_CREDENTIAL_KEKS_JSON}
      TENANT_PROVIDER_CREDENTIAL_FINGERPRINT_KEY: ${TENANT_PROVIDER_CREDENTIAL_FINGERPRINT_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      tunnel-client:
        condition: service_started
      mailpit:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
    restart: unless-stopped

  model-discovery:
    logging: *default-logging
    build:
      context: ../../
      dockerfile: apps/model-discovery/Dockerfile
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      DATABASE_URL: ${MODEL_DISCOVERY_DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/model_discovery?schema=public}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-s4M6gOMp77ss}
      TYPESENSE_HOST: typesense
      TYPESENSE_PORT: 8108
      TYPESENSE_PROTOCOL: http
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:-xyz}
      TYPESENSE_COLLECTION_MODELS: ${TYPESENSE_COLLECTION_MODELS:-models}
      TYPESENSE_READS_ENABLED: ${TYPESENSE_READS_ENABLED:-true}
      TYPESENSE_READY_STRICT: ${TYPESENSE_READY_STRICT:-true}
      MASTER_KEY: ${MASTER_KEY:-sk-dev-master-key-12345}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret}
      CORS_ORIGIN: ${MODEL_DISCOVERY_CORS_ORIGIN:-http://localhost:3000,http://localhost:3001,http://localhost:4000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      typesense:
        condition: service_started
      model-discovery-migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3002/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  model-discovery-migrate:
    build:
      context: ../../
      dockerfile: apps/model-discovery/Dockerfile
      target: migrate
    command:
      [
        "sh",
        "-c",
        "pnpm exec prisma migrate deploy && pnpm run import:providers:yaml -- --providers anthropic,google-gemini,openai",
      ]
    environment:
      DATABASE_URL: ${MODEL_DISCOVERY_DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/model_discovery?schema=public}
    depends_on:
      postgres:
        condition: service_healthy

  support-admin:
    logging: *default-logging
    build:
      context: ../../
      dockerfile: apps/support-admin/Dockerfile
    env_file:
      - path: ../../apps/support-admin/.env
        required: false
    ports:
      - "${SUPPORT_ADMIN_HOST_PORT:-3001}:3000"
    environment:
      MODEL_DISCOVERY_API_BASE_INTERNAL: ${MODEL_DISCOVERY_API_BASE_INTERNAL:-http://model-discovery:3002/api/v1}
      DATABASE_URL: ${SUPPORT_ADMIN_DATABASE_URL:-postgresql://support_admin:local-support-admin-only@postgres:5432/support_admin?schema=public}
      SHAHRAH_CONTROL_PLANE_URL: ${SHAHRAH_CONTROL_PLANE_URL:-http://control-plane:4000}
      SUPPORT_ADMIN_ORIGIN: ${SUPPORT_ADMIN_ORIGIN:-http://localhost:3001}
    depends_on:
      model-discovery:
        condition: service_started
      control-plane:
        condition: service_started
    restart: unless-stopped

  model-discovery-web:
    logging: *default-logging
    build:
      context: ../../
      dockerfile: apps/model-discovery-web/Dockerfile
    ports:
      - "${MODEL_DISCOVERY_WEB_HOST_PORT:-3003}:3000"
    environment:
      MODEL_DISCOVERY_API_BASE_INTERNAL: ${MODEL_DISCOVERY_API_BASE_INTERNAL:-http://model-discovery:3002/api/v1}
    depends_on:
      model-discovery:
        condition: service_started
    restart: unless-stopped

  support-admin-migrate:
    build:
      context: ../../
      dockerfile: apps/support-admin/Dockerfile
      target: migrate
    command: ["pnpm", "exec", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: ${SUPPORT_ADMIN_DATABASE_URL:-postgresql://support_admin:local-support-admin-only@postgres:5432/support_admin?schema=public}
    depends_on:
      postgres:
        condition: service_healthy

  tunnel-client:
    logging: *default-logging
    build:
      context: ../../
      dockerfile: services/tunnel-client/Dockerfile
    ports:
      - "8081:8081"
    environment:
      TUNNEL_CLIENT_ADDR: :8081
      TUNNEL_SERVER_URL: http://tunnel-server:8082
    depends_on:
      tunnel-server:
        condition: service_started
    restart: unless-stopped

  tunnel-server:
    logging: *default-logging
    build:
      context: ../../
      dockerfile: services/tunnel-server/Dockerfile
    ports:
      - "8082:8082"
    environment:
      TUNNEL_SERVER_ADDR: :8082
      SILK_ROAD_URL: http://silk-road:8083
    depends_on:
      silk-road:
        condition: service_started
    restart: unless-stopped

  silk-road:
    logging: *default-logging
    build:
      context: ../../
      dockerfile: services/silk-road/Dockerfile
    ports:
      - "8083:8083"
    environment:
      SILK_ROAD_ADDR: :8083
      SILK_ROAD_EGRESS_PROXY_URL: ${SILK_ROAD_EGRESS_PROXY_URL:-}
      SILK_ROAD_EGRESS_PROXY_REQUIRED: ${SILK_ROAD_EGRESS_PROXY_REQUIRED:-false}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  postgres:
    logging: *default-logging
    image: postgres:${POSTGRES_VERSION:-18}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sharah_db
      SUPPORT_ADMIN_DB_PASSWORD: ${SUPPORT_ADMIN_DB_PASSWORD:-local-support-admin-only}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./postgres/initdb/01-create-model-discovery.sql:/docker-entrypoint-initdb.d/01-create-model-discovery.sql:ro
      - ./postgres/initdb/02-create-support-admin.sh:/docker-entrypoint-initdb.d/02-create-support-admin.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: ../../
      dockerfile: infra/compose/images/goose.Dockerfile
    volumes:
      - ../../db/main/migrations:/migrations
    working_dir: /migrations
    command: ["postgres", "postgresql://postgres:postgres@postgres:5432/sharah_db?sslmode=disable", "up"]
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    logging: *default-logging
    image: redis:${REDIS_VERSION:-8-alpine}
    ports:
      - "6379:6379"
    command: sh -c 'if [ -n "$$REDIS_PASSWORD" ]; then exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"; else exec redis-server --appendonly yes; fi'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-s4M6gOMp77ss}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$$REDIS_PASSWORD\" ]; then redis-cli -a \"$$REDIS_PASSWORD\" ping; else redis-cli ping; fi"]
      interval: 5s
      timeout: 5s
      retries: 5

  clickhouse:
    logging: *default-logging
    image: clickhouse/clickhouse-server:${CLICKHOUSE_VERSION:-26.3}
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    environment:
      CLICKHOUSE_DB: sharah_db
      CLICKHOUSE_USER: sharah_user
      CLICKHOUSE_PASSWORD: "5r74Fq90EyWA"
    volumes:
      - clickhousedata:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  typesense:
    logging: *default-logging
    image: typesense/typesense:${TYPESENSE_VERSION:-29.1}
    ports:
      - "${TYPESENSE_HOST_PORT:-8108}:8108"
    environment:
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:-xyz}
      TYPESENSE_DATA_DIR: /data
      TYPESENSE_ENABLE_CORS: "true"
    command: ["--api-key=${TYPESENSE_API_KEY:-xyz}", "--data-dir=/data", "--enable-cors"]
    volumes:
      - typesensedata:/data
    restart: unless-stopped

  mailpit:
    logging: *default-logging
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

  minio:
    logging: *default-logging
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "${MINIO_API_HOST_PORT:-9002}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${SUPPORT_S3_ACCESS_KEY:-godarai-local}
      MINIO_ROOT_PASSWORD: ${SUPPORT_S3_SECRET_KEY:-godarai-local-secret}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing local/godarai-support &&
        mc anonymous set none local/godarai-support
    environment:
      MINIO_ROOT_USER: ${SUPPORT_S3_ACCESS_KEY:-godarai-local}
      MINIO_ROOT_PASSWORD: ${SUPPORT_S3_SECRET_KEY:-godarai-local-secret}

  clamav:
    logging: *default-logging
    image: clamav/clamav:stable
    ports:
      - "${CLAMAV_HOST_PORT:-3310}:3310"
    healthcheck:
      test: ["CMD-SHELL", "printf 'PING\\n' | nc 127.0.0.1 3310 | grep PONG"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  pgadmin:
    logging: *default-logging
    image: dpage/pgadmin4:latest
    ports:
      - "${PGADMIN_HOST_PORT:-5050}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  clickhousedata:
  typesensedata:
  miniodata:
  pgadmin_data:
