global
    log /dev/log local0
    log /dev/log local1 notice
    daemon
    maxconn 4096

defaults
    log global
    mode tcp
    option tcplog
    option dontlognull
    timeout connect 5s
    timeout client  60s
    timeout server  60s
    retries 3

frontend public_http
    bind :80
    # Keep the public L4 idle timeout above the production ingress timeout (330s).
    timeout client 360s
    default_backend ingress_http

frontend public_https
    bind :443
    # Keep the public L4 idle timeout above the production ingress timeout (330s).
    timeout client 360s
    default_backend ingress_https

frontend private_k8s_api
    bind 10.10.0.6:6443
    default_backend k8s_api

backend ingress_http
    option tcp-check
    balance roundrobin
    timeout server 360s
    server node1 10.10.0.21:30081 check
    server node2 10.10.0.22:30081 check
    server node3 10.10.0.23:30081 check

backend ingress_https
    option tcp-check
    balance roundrobin
    timeout server 360s
    server node1 10.10.0.21:30444 check
    server node2 10.10.0.22:30444 check
    server node3 10.10.0.23:30444 check

backend k8s_api
    option tcp-check
    balance roundrobin
    server node1 10.10.0.21:6443 check
    server node2 10.10.0.22:6443 check
    server node3 10.10.0.23:6443 check
