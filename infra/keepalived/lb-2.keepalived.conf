global_defs {
  router_id LB2
  enable_script_security
  script_user root
}

vrrp_script chk_haproxy {
  script "/etc/keepalived/check_haproxy.sh"
  interval 2
  fall 2
  rise 2
}

vrrp_instance VI_K8S_API {
  state BACKUP
  interface eth0
  virtual_router_id 51
  priority 150
  advert_int 1

  authentication {
    auth_type PASS
    auth_pass K8sVip01
  }

  virtual_ipaddress {
    10.10.0.6/24
  }

  track_script {
    chk_haproxy
  }
}
