apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-ssh-known-hosts-cm
  namespace: argocd
data:
  # If you edit by hand, keep every known_hosts line indented under this block.
  ssh_known_hosts: |
    github.com ssh-ed25519 REPLACE_WITH_GITHUB_SSH_ED25519_HOST_KEY
    github.com ecdsa-sha2-nistp256 REPLACE_WITH_GITHUB_SSH_ECDSA_HOST_KEY
    github.com ssh-rsa REPLACE_WITH_GITHUB_SSH_RSA_HOST_KEY
