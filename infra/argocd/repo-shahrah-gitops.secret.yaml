    -----BEGIN OPENSSH PRIVATE KEY-----
    REPLACE_WITH_ARGOCD_DEPLOY_KEY_PRIVATE_KEY_LINE_1
    REPLACE_WITH_ARGOCD_DEPLOY_KEY_PRIVATE_KEY_LINE_2
    REPLACE_WITH_ARGOCD_DEPLOY_KEY_PRIVATE_KEY_LINE_3
    REPLACE_WITH_ARGOCD_DEPLOY_KEY_PRIVATE_KEY_LINE_4
    REPLACE_WITH_ARGOCD_DEPLOY_KEY_PRIVATE_KEY_LINE_5
    REPLACE_WITH_ARGOCD_DEPLOY_KEY_PRIVATE_KEY_LINE_6
    -----END OPENSSH PRIVATE KEY-----
