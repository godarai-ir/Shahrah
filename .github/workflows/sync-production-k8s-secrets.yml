name: Sync Production Kubernetes Secrets

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-k8s-secrets
  cancel-in-progress: false

env:
  NAMESPACE: shahrah-production
  REGISTRY_SECRET_NAME: regcred
  REGISTRY_AUTH_SERVER: https://index.docker.io/v1/
  APP_SECRET_NAME: shahrah-secret
  REDIS_RUNTIME_SECRET_NAME: shahrah-redis-runtime
  REDIS_DLQ_SECRET_NAME: shahrah-redis-dlq
  MONGODB_SECRET_NAME: mongodb-secret
  LIBRECHAT_REDIS_SECRET_NAME: librechat-redis
  LIBRECHAT_SECRET_NAME: librechat-secret
  CLICKHOUSE_BACKUP_SECRET_NAME: clickhouse-backup-s3
  CLICKHOUSE_BACKUP_S3_ENDPOINT: https://s3.ir-thr-at1.arvanstorage.ir/godar-ai/shahrah/production/clickhouse/
  CLICKHOUSE_BACKUP_S3_REGION: ir-thr-at1
  PRODUCTION_BASTION_HOST: 37.152.191.92
  PRODUCTION_BASTION_USER: ubuntu
  PRODUCTION_BASTION_HOST_KEY_SHA256: SHA256:KSFFqwFrzuFKPJVBvONAkN8fBAID4slqYtK4BTbHsso
  KUBE_API_TUNNEL_PORT: "16443"
  KUBE_API_TUNNEL_TARGET: 10.10.0.6:6443

jobs:
  sync:
    name: Sync production secrets
    runs-on: ${{ vars.OPS_RUNNER || vars.DEFAULT_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Validate required secrets
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
          PRODUCTION_BASTION_SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_BASTION_SSH_PRIVATE_KEY }}
          REGISTRY_URL: ${{ secrets.REGISTRY_URL }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MODEL_DISCOVERY_DATABASE_URL: ${{ secrets.MODEL_DISCOVERY_DATABASE_URL }}
          SUPPORT_ADMIN_DATABASE_URL: ${{ secrets.SUPPORT_ADMIN_DATABASE_URL }}
          PRIVATE_FILES_S3_ACCESS_KEY: ${{ secrets.PRIVATE_FILES_S3_ACCESS_KEY }}
          PRIVATE_FILES_S3_SECRET_KEY: ${{ secrets.PRIVATE_FILES_S3_SECRET_KEY }}
          CLICKHOUSE_PASSWORD: ${{ secrets.CLICKHOUSE_PASSWORD }}
          CLICKHOUSE_BACKUP_S3_ACCESS_KEY: ${{ secrets.CLICKHOUSE_BACKUP_S3_ACCESS_KEY }}
          CLICKHOUSE_BACKUP_S3_SECRET_KEY: ${{ secrets.CLICKHOUSE_BACKUP_S3_SECRET_KEY }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          MASTER_KEY: ${{ secrets.MASTER_KEY }}
          MODEL_DISCOVERY_SERVICE_TOKEN: ${{ secrets.MODEL_DISCOVERY_SERVICE_TOKEN }}
          CONTROL_PLANE_SERVICE_TOKEN: ${{ secrets.CONTROL_PLANE_SERVICE_TOKEN }}
          PLATFORM_PROVIDER_CREDENTIAL_KEKS_JSON: ${{ secrets.PLATFORM_PROVIDER_CREDENTIAL_KEKS_JSON }}
          PLATFORM_PROVIDER_CREDENTIAL_FINGERPRINT_KEY: ${{ secrets.PLATFORM_PROVIDER_CREDENTIAL_FINGERPRINT_KEY }}
          TENANT_PROVIDER_CREDENTIAL_ACTIVE_KEK_VERSION: ${{ secrets.TENANT_PROVIDER_CREDENTIAL_ACTIVE_KEK_VERSION }}
          TENANT_PROVIDER_CREDENTIAL_KEKS_JSON: ${{ secrets.TENANT_PROVIDER_CREDENTIAL_KEKS_JSON }}
          TENANT_PROVIDER_CREDENTIAL_FINGERPRINT_KEY: ${{ secrets.TENANT_PROVIDER_CREDENTIAL_FINGERPRINT_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          TRACE_PAYLOAD_ENCRYPTION_KEY: ${{ secrets.TRACE_PAYLOAD_ENCRYPTION_KEY }}
          TRACE_PII_HASH_SALT: ${{ secrets.TRACE_PII_HASH_SALT }}
          DEEPSEEK_USER_ID_HMAC_SECRET: ${{ secrets.DEEPSEEK_USER_ID_HMAC_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          OAUTH_GITHUB_CLIENT_ID: ${{ secrets.OAUTH_GITHUB_CLIENT_ID }}
          OAUTH_GITHUB_CLIENT_SECRET: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          MICROSOFT_CLIENT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
          ARVANCLOUD_API_KEY: ${{ secrets.ARVANCLOUD_API_KEY }}
          SHAHRAH_SMART_CACHE_EMBEDDING_BASE_URL: ${{ secrets.SHAHRAH_SMART_CACHE_EMBEDDING_BASE_URL }}
          SHAHRAH_SMART_CACHE_EMBEDDING_API_KEY: ${{ secrets.SHAHRAH_SMART_CACHE_EMBEDDING_API_KEY }}
          MONGODB_ROOT_PASSWORD: ${{ secrets.MONGODB_ROOT_PASSWORD }}
          MONGODB_APP_PASSWORD: ${{ secrets.MONGODB_APP_PASSWORD }}
          MONGODB_KEYFILE: ${{ secrets.MONGODB_KEYFILE }}
          LIBRECHAT_REDIS_PASSWORD: ${{ secrets.LIBRECHAT_REDIS_PASSWORD }}
          LIBRECHAT_CREDS_KEY: ${{ secrets.LIBRECHAT_CREDS_KEY }}
          LIBRECHAT_CREDS_IV: ${{ secrets.LIBRECHAT_CREDS_IV }}
          LIBRECHAT_JWT_SECRET: ${{ secrets.LIBRECHAT_JWT_SECRET }}
          LIBRECHAT_JWT_REFRESH_SECRET: ${{ secrets.LIBRECHAT_JWT_REFRESH_SECRET }}
          LIBRECHAT_OPENID_SESSION_SECRET: ${{ secrets.LIBRECHAT_OPENID_SESSION_SECRET }}
          CHAT_PROVISIONING_TOKEN: ${{ secrets.CHAT_PROVISIONING_TOKEN }}
          OIDC_SIGNING_KEY_PEM: ${{ secrets.OIDC_SIGNING_KEY_PEM }}
          LIBRECHAT_S3_ACCESS_KEY: ${{ secrets.LIBRECHAT_S3_ACCESS_KEY }}
          LIBRECHAT_S3_SECRET_KEY: ${{ secrets.LIBRECHAT_S3_SECRET_KEY }}
        run: |
          missing=0
          for name in \
            KUBE_CONFIG_DATA \
            PRODUCTION_BASTION_SSH_PRIVATE_KEY \
            REGISTRY_URL \
            REGISTRY_USERNAME \
            REGISTRY_PASSWORD \
            DATABASE_URL \
            MODEL_DISCOVERY_DATABASE_URL \
            SUPPORT_ADMIN_DATABASE_URL \
            PRIVATE_FILES_S3_ACCESS_KEY \
            PRIVATE_FILES_S3_SECRET_KEY \
            CLICKHOUSE_PASSWORD \
            CLICKHOUSE_BACKUP_S3_ACCESS_KEY \
            CLICKHOUSE_BACKUP_S3_SECRET_KEY \
            REDIS_PASSWORD \
            MASTER_KEY \
            MODEL_DISCOVERY_SERVICE_TOKEN \
            CONTROL_PLANE_SERVICE_TOKEN \
            PLATFORM_PROVIDER_CREDENTIAL_KEKS_JSON \
            PLATFORM_PROVIDER_CREDENTIAL_FINGERPRINT_KEY \
            TENANT_PROVIDER_CREDENTIAL_ACTIVE_KEK_VERSION \
            TENANT_PROVIDER_CREDENTIAL_KEKS_JSON \
            TENANT_PROVIDER_CREDENTIAL_FINGERPRINT_KEY \
            JWT_SECRET \
            TRACE_PAYLOAD_ENCRYPTION_KEY \
            TRACE_PII_HASH_SALT \
            DEEPSEEK_USER_ID_HMAC_SECRET \
            RESEND_API_KEY \
            BETTER_AUTH_SECRET \
            GOOGLE_CLIENT_ID \
            GOOGLE_CLIENT_SECRET \
            OAUTH_GITHUB_CLIENT_ID \
            OAUTH_GITHUB_CLIENT_SECRET \
            MICROSOFT_CLIENT_ID \
            MICROSOFT_CLIENT_SECRET \
            ARVANCLOUD_API_KEY \
            SHAHRAH_SMART_CACHE_EMBEDDING_BASE_URL \
            SHAHRAH_SMART_CACHE_EMBEDDING_API_KEY \
            MONGODB_ROOT_PASSWORD \
            MONGODB_APP_PASSWORD \
            MONGODB_KEYFILE \
            LIBRECHAT_REDIS_PASSWORD \
            LIBRECHAT_CREDS_KEY \
            LIBRECHAT_CREDS_IV \
            LIBRECHAT_JWT_SECRET \
            LIBRECHAT_JWT_REFRESH_SECRET \
            LIBRECHAT_OPENID_SESSION_SECRET \
            CHAT_PROVISIONING_TOKEN \
            LIBRECHAT_S3_ACCESS_KEY \
            LIBRECHAT_S3_SECRET_KEY \
            OIDC_SIGNING_KEY_PEM
          do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required GitHub Actions secret: ${name}"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          if [ "${#CHAT_PROVISIONING_TOKEN}" -lt 32 ]; then
            echo "::error::CHAT_PROVISIONING_TOKEN must be at least 32 characters."
            missing=1
          fi
          # The control plane refuses to start without a PEM private key (EC P-256, SEC1 or PKCS#8).
          case "$OIDC_SIGNING_KEY_PEM" in
            "-----BEGIN EC PRIVATE KEY-----"*|"-----BEGIN PRIVATE KEY-----"*) ;;
            *)
              echo "::error::OIDC_SIGNING_KEY_PEM must be a PEM private key (openssl ecparam -name prime256v1 -genkey -noout)."
              missing=1
              ;;
          esac
          # mongod rejects a keyfile shorter than 6 or longer than 1024 characters.
          if [ "${#MONGODB_KEYFILE}" -lt 6 ] || [ "${#MONGODB_KEYFILE}" -gt 1024 ]; then
            echo "::error::MONGODB_KEYFILE must be 6-1024 characters (openssl rand -base64 756, newlines removed)."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          invalid=0
          for name in \
            DATABASE_URL \
            MODEL_DISCOVERY_DATABASE_URL \
            SUPPORT_ADMIN_DATABASE_URL
          do
            value="${!name}"
            if ! printf '%s' "$value" | grep -Eq '^postgres(ql)?://[^/@:]+:[^/@]+@[^/:]+:[0-9]+/[^/?]+'; then
              echo "::error::${name} must be a complete PostgreSQL connection URL (postgresql://USER:PASSWORD@HOST:PORT/DATABASE)."
              invalid=1
            fi
          done

          if [ "$invalid" -ne 0 ]; then
            exit 1
          fi

          python - <<'PY'
          import base64
          import json
          import os
          import sys

          active_version = os.environ["TENANT_PROVIDER_CREDENTIAL_ACTIVE_KEK_VERSION"].strip()
          errors = []

          try:
              encoded_keks = json.loads(os.environ["TENANT_PROVIDER_CREDENTIAL_KEKS_JSON"])
          except json.JSONDecodeError:
              encoded_keks = None
              errors.append("TENANT_PROVIDER_CREDENTIAL_KEKS_JSON must be a valid JSON object.")

          if not isinstance(encoded_keks, dict) or not encoded_keks:
              if encoded_keks is not None:
                  errors.append("TENANT_PROVIDER_CREDENTIAL_KEKS_JSON must contain at least one KEK version.")
          else:
              if active_version not in encoded_keks:
                  errors.append("TENANT_PROVIDER_CREDENTIAL_ACTIVE_KEK_VERSION must exist in TENANT_PROVIDER_CREDENTIAL_KEKS_JSON.")

              for version, encoded_key in encoded_keks.items():
                  if not isinstance(version, str) or not version.strip() or not isinstance(encoded_key, str):
                      errors.append("Every tenant KEK entry must have a non-empty version and a base64 string value.")
                      continue
                  try:
                      decoded_key = base64.b64decode(encoded_key, validate=True)
                  except (ValueError, TypeError):
                      errors.append(f"Tenant KEK version {version!r} is not valid base64.")
                      continue
                  if len(decoded_key) != 32:
                      errors.append(f"Tenant KEK version {version!r} must decode to exactly 32 bytes.")

          try:
              fingerprint_key = base64.b64decode(
                  os.environ["TENANT_PROVIDER_CREDENTIAL_FINGERPRINT_KEY"],
                  validate=True,
              )
          except (ValueError, TypeError):
              fingerprint_key = b""
              errors.append("TENANT_PROVIDER_CREDENTIAL_FINGERPRINT_KEY must be valid base64.")

          if fingerprint_key and len(fingerprint_key) < 32:
              errors.append("TENANT_PROVIDER_CREDENTIAL_FINGERPRINT_KEY must decode to at least 32 bytes.")

          for error in errors:
              print(f"::error::{error}")

          if errors:
              sys.exit(1)
          PY

      - name: Set up kubectl
        uses: azure/setup-kubectl@v5.1.0

      - name: Configure kubeconfig
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBE_CONFIG_DATA" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Open production API tunnel
        env:
          PRODUCTION_BASTION_SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_BASTION_SSH_PRIVATE_KEY }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends putty-tools

          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PRODUCTION_BASTION_SSH_PRIVATE_KEY" > "$HOME/.ssh/production_bastion.ppk"
          chmod 600 "$HOME/.ssh/production_bastion.ppk"

          if ! grep -q '^PuTTY-User-Key-File-' "$HOME/.ssh/production_bastion.ppk"; then
            echo "::error::PRODUCTION_BASTION_SSH_PRIVATE_KEY must contain a PuTTY private key."
            exit 1
          fi

          plink \
            -ssh \
            -N \
            -batch \
            -hostkey "$PRODUCTION_BASTION_HOST_KEY_SHA256" \
            -i "$HOME/.ssh/production_bastion.ppk" \
            -L "127.0.0.1:${KUBE_API_TUNNEL_PORT}:${KUBE_API_TUNNEL_TARGET}" \
            "${PRODUCTION_BASTION_USER}@${PRODUCTION_BASTION_HOST}" \
            > "$RUNNER_TEMP/production-bastion.log" 2>&1 &
          tunnel_pid=$!

          for attempt in $(seq 1 10); do
            if timeout 1 bash -c "</dev/tcp/127.0.0.1/${KUBE_API_TUNNEL_PORT}" 2>/dev/null; then
              break
            fi
            if ! kill -0 "$tunnel_pid" 2>/dev/null; then
              echo "::error::Production bastion tunnel exited before it became ready."
              sed -n '1,20p' "$RUNNER_TEMP/production-bastion.log"
              exit 1
            fi
            if [ "$attempt" -eq 10 ]; then
              echo "::error::Production bastion tunnel did not become ready."
              exit 1
            fi
            sleep 2
          done

          cluster_name="$(kubectl config view --minify -o jsonpath='{.contexts[0].context.cluster}')"
          kubectl config set-cluster "$cluster_name" --server="https://127.0.0.1:${KUBE_API_TUNNEL_PORT}"

      - name: Verify cluster access
        run: |
          kubectl version --client=true
          kubectl cluster-info
          kubectl auth can-i create namespaces | grep -qx yes
          kubectl auth can-i create secrets -n "$NAMESPACE" | grep -qx yes
          kubectl auth can-i create secrets -n ingress-nginx | grep -qx yes
          kubectl auth can-i create secrets -n cert-manager | grep -qx yes

      - name: Ensure namespace
        run: |
          kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
          kubectl create namespace ingress-nginx --dry-run=client -o yaml | kubectl apply -f -
          kubectl create namespace cert-manager --dry-run=client -o yaml | kubectl apply -f -

      - name: Sync image pull secret
        env:
          REGISTRY_URL: ${{ secrets.REGISTRY_URL }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          kubectl -n "$NAMESPACE" create secret docker-registry "$REGISTRY_SECRET_NAME" \
            --docker-server="$REGISTRY_AUTH_SERVER" \
            --docker-username="$REGISTRY_USERNAME" \
            --docker-password="$REGISTRY_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl -n ingress-nginx create secret docker-registry "$REGISTRY_SECRET_NAME" \
            --docker-server="$REGISTRY_AUTH_SERVER" \
            --docker-username="$REGISTRY_USERNAME" \
            --docker-password="$REGISTRY_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Sync ArvanCloud DNS API secret
        env:
          ARVANCLOUD_API_KEY: ${{ secrets.ARVANCLOUD_API_KEY }}
        run: |
          kubectl -n cert-manager create secret generic arvancloud-api-key \
            --from-literal=apikey="$ARVANCLOUD_API_KEY" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Sync application secret
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MODEL_DISCOVERY_DATABASE_URL: ${{ secrets.MODEL_DISCOVERY_DATABASE_URL }}
          SUPPORT_ADMIN_DATABASE_URL: ${{ secrets.SUPPORT_ADMIN_DATABASE_URL }}
          PRIVATE_FILES_S3_ACCESS_KEY: ${{ secrets.PRIVATE_FILES_S3_ACCESS_KEY }}
          PRIVATE_FILES_S3_SECRET_KEY: ${{ secrets.PRIVATE_FILES_S3_SECRET_KEY }}
          CLICKHOUSE_DSN: ${{ secrets.CLICKHOUSE_DSN }}
          CLICKHOUSE_PASSWORD: ${{ secrets.CLICKHOUSE_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          TYPESENSE_API_KEY: ${{ secrets.TYPESENSE_API_KEY }}
          MASTER_KEY: ${{ secrets.MASTER_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          TRACE_PAYLOAD_ENCRYPTION_KEY: ${{ secrets.TRACE_PAYLOAD_ENCRYPTION_KEY }}
          TRACE_PII_HASH_SALT: ${{ secrets.TRACE_PII_HASH_SALT }}
          DEEPSEEK_USER_ID_HMAC_SECRET: ${{ secrets.DEEPSEEK_USER_ID_HMAC_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          OAUTH_GITHUB_CLIENT_ID: ${{ secrets.OAUTH_GITHUB_CLIENT_ID }}
          OAUTH_GITHUB_CLIENT_SECRET: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          MICROSOFT_CLIENT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          SHAHRAH_DISCOVERY_TOKEN: ${{ secrets.SHAHRAH_DISCOVERY_TOKEN }}
          MODEL_DISCOVERY_SERVICE_TOKEN: ${{ secrets.MODEL_DISCOVERY_SERVICE_TOKEN }}
          CONTROL_PLANE_SERVICE_TOKEN: ${{ secrets.CONTROL_PLANE_SERVICE_TOKEN }}
          PLATFORM_PROVIDER_CREDENTIAL_KEKS_JSON: ${{ secrets.PLATFORM_PROVIDER_CREDENTIAL_KEKS_JSON }}
          PLATFORM_PROVIDER_CREDENTIAL_FINGERPRINT_KEY: ${{ secrets.PLATFORM_PROVIDER_CREDENTIAL_FINGERPRINT_KEY }}
          TENANT_PROVIDER_CREDENTIAL_ACTIVE_KEK_VERSION: ${{ secrets.TENANT_PROVIDER_CREDENTIAL_ACTIVE_KEK_VERSION }}
          TENANT_PROVIDER_CREDENTIAL_KEKS_JSON: ${{ secrets.TENANT_PROVIDER_CREDENTIAL_KEKS_JSON }}
          TENANT_PROVIDER_CREDENTIAL_FINGERPRINT_KEY: ${{ secrets.TENANT_PROVIDER_CREDENTIAL_FINGERPRINT_KEY }}
          SHAHRAH_SMART_CACHE_EMBEDDING_BASE_URL: ${{ secrets.SHAHRAH_SMART_CACHE_EMBEDDING_BASE_URL }}
          SHAHRAH_SMART_CACHE_EMBEDDING_API_KEY: ${{ secrets.SHAHRAH_SMART_CACHE_EMBEDDING_API_KEY }}
          CHAT_PROVISIONING_TOKEN: ${{ secrets.CHAT_PROVISIONING_TOKEN }}
          OIDC_SIGNING_KEY_PEM: ${{ secrets.OIDC_SIGNING_KEY_PEM }}
        run: |
          kubectl -n "$NAMESPACE" create secret generic "$APP_SECRET_NAME" \
            --from-literal=DATABASE_URL="$DATABASE_URL" \
            --from-literal=MODEL_DISCOVERY_DATABASE_URL="$MODEL_DISCOVERY_DATABASE_URL" \
            --from-literal=SUPPORT_ADMIN_DATABASE_URL="$SUPPORT_ADMIN_DATABASE_URL" \
            --from-literal=PRIVATE_FILES_S3_ACCESS_KEY="$PRIVATE_FILES_S3_ACCESS_KEY" \
            --from-literal=PRIVATE_FILES_S3_SECRET_KEY="$PRIVATE_FILES_S3_SECRET_KEY" \
            --from-literal=CLICKHOUSE_DSN="$CLICKHOUSE_DSN" \
            --from-literal=CLICKHOUSE_PASSWORD="$CLICKHOUSE_PASSWORD" \
            --from-literal=REDIS_PASSWORD="$REDIS_PASSWORD" \
            --from-literal=TYPESENSE_API_KEY="$TYPESENSE_API_KEY" \
            --from-literal=MASTER_KEY="$MASTER_KEY" \
            --from-literal=JWT_SECRET="$JWT_SECRET" \
            --from-literal=TRACE_PAYLOAD_ENCRYPTION_KEY="$TRACE_PAYLOAD_ENCRYPTION_KEY" \
            --from-literal=TRACE_PII_HASH_SALT="$TRACE_PII_HASH_SALT" \
            --from-literal=DEEPSEEK_USER_ID_HMAC_SECRET="$DEEPSEEK_USER_ID_HMAC_SECRET" \
            --from-literal=RESEND_API_KEY="$RESEND_API_KEY" \
            --from-literal=BETTER_AUTH_SECRET="$BETTER_AUTH_SECRET" \
            --from-literal=GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID" \
            --from-literal=GOOGLE_CLIENT_SECRET="$GOOGLE_CLIENT_SECRET" \
            --from-literal=GITHUB_CLIENT_ID="$OAUTH_GITHUB_CLIENT_ID" \
            --from-literal=GITHUB_CLIENT_SECRET="$OAUTH_GITHUB_CLIENT_SECRET" \
            --from-literal=MICROSOFT_CLIENT_ID="$MICROSOFT_CLIENT_ID" \
            --from-literal=MICROSOFT_CLIENT_SECRET="$MICROSOFT_CLIENT_SECRET" \
            --from-literal=OPENAI_API_KEY="$OPENAI_API_KEY" \
            --from-literal=TYPESAFE_API_KEY="$TYPESAFE_API_KEY" \
            --from-literal=SHAHRAH_DISCOVERY_TOKEN="$SHAHRAH_DISCOVERY_TOKEN" \
            --from-literal=MODEL_DISCOVERY_SERVICE_TOKEN="$MODEL_DISCOVERY_SERVICE_TOKEN" \
            --from-literal=CONTROL_PLANE_SERVICE_TOKEN="$CONTROL_PLANE_SERVICE_TOKEN" \
            --from-literal=PLATFORM_PROVIDER_CREDENTIAL_KEKS_JSON="$PLATFORM_PROVIDER_CREDENTIAL_KEKS_JSON" \
            --from-literal=PLATFORM_PROVIDER_CREDENTIAL_FINGERPRINT_KEY="$PLATFORM_PROVIDER_CREDENTIAL_FINGERPRINT_KEY" \
            --from-literal=TENANT_PROVIDER_CREDENTIAL_ACTIVE_KEK_VERSION="$TENANT_PROVIDER_CREDENTIAL_ACTIVE_KEK_VERSION" \
            --from-literal=TENANT_PROVIDER_CREDENTIAL_KEKS_JSON="$TENANT_PROVIDER_CREDENTIAL_KEKS_JSON" \
            --from-literal=TENANT_PROVIDER_CREDENTIAL_FINGERPRINT_KEY="$TENANT_PROVIDER_CREDENTIAL_FINGERPRINT_KEY" \
            --from-literal=SHAHRAH_SMART_CACHE_EMBEDDING_BASE_URL="$SHAHRAH_SMART_CACHE_EMBEDDING_BASE_URL" \
            --from-literal=SHAHRAH_SMART_CACHE_EMBEDDING_API_KEY="$SHAHRAH_SMART_CACHE_EMBEDDING_API_KEY" \
            --from-literal=CHAT_PROVISIONING_TOKEN="$CHAT_PROVISIONING_TOKEN" \
            --from-literal=OIDC_SIGNING_KEY_PEM="$OIDC_SIGNING_KEY_PEM" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Verify application secret keys
        run: |
          missing=0
          for key in \
            PRIVATE_FILES_S3_ACCESS_KEY \
            PRIVATE_FILES_S3_SECRET_KEY \
            DEEPSEEK_USER_ID_HMAC_SECRET \
            BETTER_AUTH_SECRET \
            GOOGLE_CLIENT_ID \
            GOOGLE_CLIENT_SECRET \
            GITHUB_CLIENT_ID \
            GITHUB_CLIENT_SECRET \
            MICROSOFT_CLIENT_ID \
            MICROSOFT_CLIENT_SECRET \
            TENANT_PROVIDER_CREDENTIAL_ACTIVE_KEK_VERSION \
            TENANT_PROVIDER_CREDENTIAL_KEKS_JSON \
            TENANT_PROVIDER_CREDENTIAL_FINGERPRINT_KEY \
            SHAHRAH_SMART_CACHE_EMBEDDING_BASE_URL \
            SHAHRAH_SMART_CACHE_EMBEDDING_API_KEY \
            CHAT_PROVISIONING_TOKEN \
            OIDC_SIGNING_KEY_PEM
          do
            encoded_value="$(kubectl -n "$NAMESPACE" get secret "$APP_SECRET_NAME" -o "jsonpath={.data.${key}}")"
            if [ -z "$encoded_value" ]; then
              echo "::error::Kubernetes secret ${APP_SECRET_NAME} is missing required key: ${key}"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Verify control-plane application secret references
        run: |
          deployment_json="$RUNNER_TEMP/control-plane-deployment.json"
          kubectl -n "$NAMESPACE" get deployment control-plane -o json > "$deployment_json"

          python - "$deployment_json" <<'PY'
          import json
          import os
          import sys

          deployment_path = sys.argv[1]
          required_keys = (
              "TENANT_PROVIDER_CREDENTIAL_ACTIVE_KEK_VERSION",
              "TENANT_PROVIDER_CREDENTIAL_KEKS_JSON",
              "TENANT_PROVIDER_CREDENTIAL_FINGERPRINT_KEY",
          )

          with open(deployment_path, encoding="utf-8") as deployment_file:
              deployment = json.load(deployment_file)

          containers = deployment["spec"]["template"]["spec"]["containers"]
          control_plane = next(
              (container for container in containers if container["name"] == "control-plane"),
              None,
          )
          if control_plane is None:
              print("::error::The control-plane container is missing from deployment/control-plane.")
              sys.exit(1)

          environment = {entry["name"]: entry for entry in control_plane.get("env", [])}
          secret_name = os.environ["APP_SECRET_NAME"]
          errors = []
          for key in required_keys:
              secret_ref = (
                  environment.get(key, {})
                  .get("valueFrom", {})
                  .get("secretKeyRef", {})
              )
              if secret_ref.get("name") != secret_name or secret_ref.get("key") != key:
                  errors.append(
                      f"deployment/control-plane must map {key} from secret {secret_name}."
                  )

          for error in errors:
              print(f"::error::{error}")

          if errors:
              sys.exit(1)
          PY

      - name: Sync dedicated Redis secrets
        env:
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          REDIS_RUNTIME_PASSWORD: ${{ secrets.REDIS_RUNTIME_PASSWORD }}
          REDIS_DLQ_PASSWORD: ${{ secrets.REDIS_DLQ_PASSWORD }}
        run: |
          runtime_password="${REDIS_RUNTIME_PASSWORD:-$REDIS_PASSWORD}"
          dlq_password="${REDIS_DLQ_PASSWORD:-$REDIS_PASSWORD}"

          kubectl -n "$NAMESPACE" create secret generic "$REDIS_RUNTIME_SECRET_NAME" \
            --from-literal=redis-password="$runtime_password" \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl -n "$NAMESPACE" create secret generic "$REDIS_DLQ_SECRET_NAME" \
            --from-literal=redis-password="$dlq_password" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Sync ClickHouse backup S3 secret
        env:
          CLICKHOUSE_BACKUP_S3_ACCESS_KEY: ${{ secrets.CLICKHOUSE_BACKUP_S3_ACCESS_KEY }}
          CLICKHOUSE_BACKUP_S3_SECRET_KEY: ${{ secrets.CLICKHOUSE_BACKUP_S3_SECRET_KEY }}
        run: |
          kubectl -n "$NAMESPACE" create secret generic "$CLICKHOUSE_BACKUP_SECRET_NAME" \
            --from-literal=endpoint="$CLICKHOUSE_BACKUP_S3_ENDPOINT" \
            --from-literal=region="$CLICKHOUSE_BACKUP_S3_REGION" \
            --from-literal=access-key="$CLICKHOUSE_BACKUP_S3_ACCESS_KEY" \
            --from-literal=secret-key="$CLICKHOUSE_BACKUP_S3_SECRET_KEY" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Sync fallback wildcard tenant TLS secret
        env:
          WILDCARD_GODARAI_IR_TLS_CRT: ${{ secrets.WILDCARD_GODARAI_IR_TLS_CRT }}
          WILDCARD_GODARAI_IR_TLS_KEY: ${{ secrets.WILDCARD_GODARAI_IR_TLS_KEY }}
        run: |
          if [ -z "$WILDCARD_GODARAI_IR_TLS_CRT" ] || [ -z "$WILDCARD_GODARAI_IR_TLS_KEY" ]; then
            echo "Wildcard TLS secrets are not configured; skipping wildcard-godarai-ir-tls."
            exit 0
          fi

          kubectl -n "$NAMESPACE" create secret tls wildcard-godarai-ir-tls \
            --cert=<(printf '%s' "$WILDCARD_GODARAI_IR_TLS_CRT") \
            --key=<(printf '%s' "$WILDCARD_GODARAI_IR_TLS_KEY") \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Sync GodarChat secrets
        env:
          MONGODB_ROOT_PASSWORD: ${{ secrets.MONGODB_ROOT_PASSWORD }}
          MONGODB_APP_PASSWORD: ${{ secrets.MONGODB_APP_PASSWORD }}
          MONGODB_KEYFILE: ${{ secrets.MONGODB_KEYFILE }}
          LIBRECHAT_REDIS_PASSWORD: ${{ secrets.LIBRECHAT_REDIS_PASSWORD }}
          LIBRECHAT_CREDS_KEY: ${{ secrets.LIBRECHAT_CREDS_KEY }}
          LIBRECHAT_CREDS_IV: ${{ secrets.LIBRECHAT_CREDS_IV }}
          LIBRECHAT_JWT_SECRET: ${{ secrets.LIBRECHAT_JWT_SECRET }}
          LIBRECHAT_JWT_REFRESH_SECRET: ${{ secrets.LIBRECHAT_JWT_REFRESH_SECRET }}
          LIBRECHAT_OPENID_SESSION_SECRET: ${{ secrets.LIBRECHAT_OPENID_SESSION_SECRET }}
          CHAT_PROVISIONING_TOKEN: ${{ secrets.CHAT_PROVISIONING_TOKEN }}
          LIBRECHAT_S3_ACCESS_KEY: ${{ secrets.LIBRECHAT_S3_ACCESS_KEY }}
          LIBRECHAT_S3_SECRET_KEY: ${{ secrets.LIBRECHAT_S3_SECRET_KEY }}
        run: |
          # Consumed by shahrah-gitops: helm/mongodb, apps/librechat-redis.yaml and the librechat workload.
          # Changing the MongoDB passwords here does not change them inside an initialised database.
          kubectl -n "$NAMESPACE" create secret generic "$MONGODB_SECRET_NAME" \
            --from-literal=mongodb-root-username=root \
            --from-literal=mongodb-root-password="$MONGODB_ROOT_PASSWORD" \
            --from-literal=librechat-password="$MONGODB_APP_PASSWORD" \
            --from-literal=mongodb-keyfile="$MONGODB_KEYFILE" \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl -n "$NAMESPACE" create secret generic "$LIBRECHAT_REDIS_SECRET_NAME" \
            --from-literal=redis-password="$LIBRECHAT_REDIS_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -

          mongo_hosts=""
          for i in 0 1 2; do
            mongo_hosts="${mongo_hosts:+${mongo_hosts},}mongodb-${i}.mongodb-headless.${NAMESPACE}.svc.cluster.local:27017"
          done

          kubectl -n "$NAMESPACE" create secret generic "$LIBRECHAT_SECRET_NAME" \
            --from-literal=CREDS_KEY="$LIBRECHAT_CREDS_KEY" \
            --from-literal=CREDS_IV="$LIBRECHAT_CREDS_IV" \
            --from-literal=JWT_SECRET="$LIBRECHAT_JWT_SECRET" \
            --from-literal=JWT_REFRESH_SECRET="$LIBRECHAT_JWT_REFRESH_SECRET" \
            --from-literal=OPENID_SESSION_SECRET="$LIBRECHAT_OPENID_SESSION_SECRET" \
            --from-literal=TENANT_PROVISIONING_TOKEN="$CHAT_PROVISIONING_TOKEN" \
            --from-literal=MONGO_URI="mongodb://librechat:${MONGODB_APP_PASSWORD}@${mongo_hosts}/LibreChat?replicaSet=rs0&authSource=LibreChat" \
            --from-literal=REDIS_URI="redis://:${LIBRECHAT_REDIS_PASSWORD}@librechat-redis-master:6379" \
            --from-literal=AWS_ACCESS_KEY_ID="$LIBRECHAT_S3_ACCESS_KEY" \
            --from-literal=AWS_SECRET_ACCESS_KEY="$LIBRECHAT_S3_SECRET_KEY" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Restart application-secret-dependent workloads
        run: |
          kubectl -n "$NAMESPACE" rollout restart deployment/control-plane deployment/silk-road
          kubectl -n "$NAMESPACE" rollout status deployment/control-plane --timeout=5m
          kubectl -n "$NAMESPACE" rollout status deployment/silk-road --timeout=5m

          # GodarChat does not exist before its first rollout; restart it only once it does.
          if kubectl -n "$NAMESPACE" get deployment librechat >/dev/null 2>&1; then
            kubectl -n "$NAMESPACE" rollout restart deployment/librechat
            kubectl -n "$NAMESPACE" rollout status deployment/librechat --timeout=5m
          fi
