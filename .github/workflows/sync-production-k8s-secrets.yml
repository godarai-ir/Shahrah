name: Sync Production Kubernetes Secrets

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-k8s-secrets
  cancel-in-progress: false

env:
  NAMESPACE: shahrah-production
  REGISTRY_SECRET_NAME: regcred
  REGISTRY_AUTH_SERVER: https://index.docker.io/v1/
  APP_SECRET_NAME: shahrah-secret
  REDIS_RUNTIME_SECRET_NAME: shahrah-redis-runtime
  REDIS_DLQ_SECRET_NAME: shahrah-redis-dlq
  CLICKHOUSE_BACKUP_SECRET_NAME: clickhouse-backup-s3
  CLICKHOUSE_BACKUP_S3_ENDPOINT: https://s3.ir-thr-at1.arvanstorage.ir/godar-ai/shahrah/production/clickhouse/
  CLICKHOUSE_BACKUP_S3_REGION: ir-thr-at1
  PRODUCTION_BASTION_HOST: 37.152.191.92
  PRODUCTION_BASTION_USER: ubuntu
  PRODUCTION_BASTION_HOST_KEY_SHA256: SHA256:KSFFqwFrzuFKPJVBvONAkN8fBAID4slqYtK4BTbHsso
  KUBE_API_TUNNEL_PORT: "16443"
  KUBE_API_TUNNEL_TARGET: 10.10.0.6:6443

jobs:
  sync:
    name: Sync production secrets
    runs-on: ${{ vars.OPS_RUNNER || vars.DEFAULT_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Validate required secrets
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
          PRODUCTION_BASTION_SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_BASTION_SSH_PRIVATE_KEY }}
          REGISTRY_URL: ${{ secrets.REGISTRY_URL }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MODEL_DISCOVERY_DATABASE_URL: ${{ secrets.MODEL_DISCOVERY_DATABASE_URL }}
          SUPPORT_ADMIN_DATABASE_URL: ${{ secrets.SUPPORT_ADMIN_DATABASE_URL }}
          CLICKHOUSE_PASSWORD: ${{ secrets.CLICKHOUSE_PASSWORD }}
          CLICKHOUSE_BACKUP_S3_ACCESS_KEY: ${{ secrets.CLICKHOUSE_BACKUP_S3_ACCESS_KEY }}
          CLICKHOUSE_BACKUP_S3_SECRET_KEY: ${{ secrets.CLICKHOUSE_BACKUP_S3_SECRET_KEY }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          MASTER_KEY: ${{ secrets.MASTER_KEY }}
          MODEL_DISCOVERY_SERVICE_TOKEN: ${{ secrets.MODEL_DISCOVERY_SERVICE_TOKEN }}
          CONTROL_PLANE_SERVICE_TOKEN: ${{ secrets.CONTROL_PLANE_SERVICE_TOKEN }}
          PLATFORM_PROVIDER_CREDENTIAL_KEKS_JSON: ${{ secrets.PLATFORM_PROVIDER_CREDENTIAL_KEKS_JSON }}
          PLATFORM_PROVIDER_CREDENTIAL_FINGERPRINT_KEY: ${{ secrets.PLATFORM_PROVIDER_CREDENTIAL_FINGERPRINT_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          TRACE_PAYLOAD_ENCRYPTION_KEY: ${{ secrets.TRACE_PAYLOAD_ENCRYPTION_KEY }}
          TRACE_PII_HASH_SALT: ${{ secrets.TRACE_PII_HASH_SALT }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ARVANCLOUD_API_KEY: ${{ secrets.ARVANCLOUD_API_KEY }}
        run: |
          missing=0
          for name in \
            KUBE_CONFIG_DATA \
            PRODUCTION_BASTION_SSH_PRIVATE_KEY \
            REGISTRY_URL \
            REGISTRY_USERNAME \
            REGISTRY_PASSWORD \
            DATABASE_URL \
            MODEL_DISCOVERY_DATABASE_URL \
            SUPPORT_ADMIN_DATABASE_URL \
            CLICKHOUSE_PASSWORD \
            CLICKHOUSE_BACKUP_S3_ACCESS_KEY \
            CLICKHOUSE_BACKUP_S3_SECRET_KEY \
            REDIS_PASSWORD \
            MASTER_KEY \
            MODEL_DISCOVERY_SERVICE_TOKEN \
            CONTROL_PLANE_SERVICE_TOKEN \
            PLATFORM_PROVIDER_CREDENTIAL_KEKS_JSON \
            PLATFORM_PROVIDER_CREDENTIAL_FINGERPRINT_KEY \
            JWT_SECRET \
            TRACE_PAYLOAD_ENCRYPTION_KEY \
            TRACE_PII_HASH_SALT \
            RESEND_API_KEY \
            ARVANCLOUD_API_KEY
          do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required GitHub Actions secret: ${name}"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          invalid=0
          for name in \
            DATABASE_URL \
            MODEL_DISCOVERY_DATABASE_URL \
            SUPPORT_ADMIN_DATABASE_URL
          do
            value="${!name}"
            if ! printf '%s' "$value" | grep -Eq '^postgres(ql)?://[^/@:]+:[^/@]+@[^/:]+:[0-9]+/[^/?]+'; then
              echo "::error::${name} must be a complete PostgreSQL connection URL (postgresql://USER:PASSWORD@HOST:PORT/DATABASE)."
              invalid=1
            fi
          done

          if [ "$invalid" -ne 0 ]; then
            exit 1
          fi

      - name: Set up kubectl
        uses: azure/setup-kubectl@v5.1.0

      - name: Configure kubeconfig
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBE_CONFIG_DATA" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Open production API tunnel
        env:
          PRODUCTION_BASTION_SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_BASTION_SSH_PRIVATE_KEY }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends putty-tools

          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PRODUCTION_BASTION_SSH_PRIVATE_KEY" > "$HOME/.ssh/production_bastion.ppk"
          chmod 600 "$HOME/.ssh/production_bastion.ppk"

          if ! grep -q '^PuTTY-User-Key-File-' "$HOME/.ssh/production_bastion.ppk"; then
            echo "::error::PRODUCTION_BASTION_SSH_PRIVATE_KEY must contain a PuTTY private key."
            exit 1
          fi

          plink \
            -ssh \
            -N \
            -batch \
            -hostkey "$PRODUCTION_BASTION_HOST_KEY_SHA256" \
            -i "$HOME/.ssh/production_bastion.ppk" \
            -L "127.0.0.1:${KUBE_API_TUNNEL_PORT}:${KUBE_API_TUNNEL_TARGET}" \
            "${PRODUCTION_BASTION_USER}@${PRODUCTION_BASTION_HOST}" \
            > "$RUNNER_TEMP/production-bastion.log" 2>&1 &
          tunnel_pid=$!

          for attempt in $(seq 1 10); do
            if timeout 1 bash -c "</dev/tcp/127.0.0.1/${KUBE_API_TUNNEL_PORT}" 2>/dev/null; then
              break
            fi
            if ! kill -0 "$tunnel_pid" 2>/dev/null; then
              echo "::error::Production bastion tunnel exited before it became ready."
              sed -n '1,20p' "$RUNNER_TEMP/production-bastion.log"
              exit 1
            fi
            if [ "$attempt" -eq 10 ]; then
              echo "::error::Production bastion tunnel did not become ready."
              exit 1
            fi
            sleep 2
          done

          cluster_name="$(kubectl config view --minify -o jsonpath='{.contexts[0].context.cluster}')"
          kubectl config set-cluster "$cluster_name" --server="https://127.0.0.1:${KUBE_API_TUNNEL_PORT}"

      - name: Verify cluster access
        run: |
          kubectl version --client=true
          kubectl cluster-info
          kubectl auth can-i create namespaces | grep -qx yes
          kubectl auth can-i create secrets -n "$NAMESPACE" | grep -qx yes
          kubectl auth can-i create secrets -n ingress-nginx | grep -qx yes
          kubectl auth can-i create secrets -n cert-manager | grep -qx yes

      - name: Ensure namespace
        run: |
          kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
          kubectl create namespace ingress-nginx --dry-run=client -o yaml | kubectl apply -f -
          kubectl create namespace cert-manager --dry-run=client -o yaml | kubectl apply -f -

      - name: Sync image pull secret
        env:
          REGISTRY_URL: ${{ secrets.REGISTRY_URL }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          kubectl -n "$NAMESPACE" create secret docker-registry "$REGISTRY_SECRET_NAME" \
            --docker-server="$REGISTRY_AUTH_SERVER" \
            --docker-username="$REGISTRY_USERNAME" \
            --docker-password="$REGISTRY_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl -n ingress-nginx create secret docker-registry "$REGISTRY_SECRET_NAME" \
            --docker-server="$REGISTRY_AUTH_SERVER" \
            --docker-username="$REGISTRY_USERNAME" \
            --docker-password="$REGISTRY_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Sync ArvanCloud DNS API secret
        env:
          ARVANCLOUD_API_KEY: ${{ secrets.ARVANCLOUD_API_KEY }}
        run: |
          kubectl -n cert-manager create secret generic arvancloud-api-key \
            --from-literal=apikey="$ARVANCLOUD_API_KEY" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Sync application secret
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MODEL_DISCOVERY_DATABASE_URL: ${{ secrets.MODEL_DISCOVERY_DATABASE_URL }}
          SUPPORT_ADMIN_DATABASE_URL: ${{ secrets.SUPPORT_ADMIN_DATABASE_URL }}
          CLICKHOUSE_DSN: ${{ secrets.CLICKHOUSE_DSN }}
          CLICKHOUSE_PASSWORD: ${{ secrets.CLICKHOUSE_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          TYPESENSE_API_KEY: ${{ secrets.TYPESENSE_API_KEY }}
          MASTER_KEY: ${{ secrets.MASTER_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          TRACE_PAYLOAD_ENCRYPTION_KEY: ${{ secrets.TRACE_PAYLOAD_ENCRYPTION_KEY }}
          TRACE_PII_HASH_SALT: ${{ secrets.TRACE_PII_HASH_SALT }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SHAHRAH_DISCOVERY_TOKEN: ${{ secrets.SHAHRAH_DISCOVERY_TOKEN }}
          MODEL_DISCOVERY_SERVICE_TOKEN: ${{ secrets.MODEL_DISCOVERY_SERVICE_TOKEN }}
          CONTROL_PLANE_SERVICE_TOKEN: ${{ secrets.CONTROL_PLANE_SERVICE_TOKEN }}
          PLATFORM_PROVIDER_CREDENTIAL_KEKS_JSON: ${{ secrets.PLATFORM_PROVIDER_CREDENTIAL_KEKS_JSON }}
          PLATFORM_PROVIDER_CREDENTIAL_FINGERPRINT_KEY: ${{ secrets.PLATFORM_PROVIDER_CREDENTIAL_FINGERPRINT_KEY }}
        run: |
          kubectl -n "$NAMESPACE" create secret generic "$APP_SECRET_NAME" \
            --from-literal=DATABASE_URL="$DATABASE_URL" \
            --from-literal=MODEL_DISCOVERY_DATABASE_URL="$MODEL_DISCOVERY_DATABASE_URL" \
            --from-literal=SUPPORT_ADMIN_DATABASE_URL="$SUPPORT_ADMIN_DATABASE_URL" \
            --from-literal=CLICKHOUSE_DSN="$CLICKHOUSE_DSN" \
            --from-literal=CLICKHOUSE_PASSWORD="$CLICKHOUSE_PASSWORD" \
            --from-literal=REDIS_PASSWORD="$REDIS_PASSWORD" \
            --from-literal=TYPESENSE_API_KEY="$TYPESENSE_API_KEY" \
            --from-literal=MASTER_KEY="$MASTER_KEY" \
            --from-literal=JWT_SECRET="$JWT_SECRET" \
            --from-literal=TRACE_PAYLOAD_ENCRYPTION_KEY="$TRACE_PAYLOAD_ENCRYPTION_KEY" \
            --from-literal=TRACE_PII_HASH_SALT="$TRACE_PII_HASH_SALT" \
            --from-literal=RESEND_API_KEY="$RESEND_API_KEY" \
            --from-literal=OPENAI_API_KEY="$OPENAI_API_KEY" \
            --from-literal=SHAHRAH_DISCOVERY_TOKEN="$SHAHRAH_DISCOVERY_TOKEN" \
            --from-literal=MODEL_DISCOVERY_SERVICE_TOKEN="$MODEL_DISCOVERY_SERVICE_TOKEN" \
            --from-literal=CONTROL_PLANE_SERVICE_TOKEN="$CONTROL_PLANE_SERVICE_TOKEN" \
            --from-literal=PLATFORM_PROVIDER_CREDENTIAL_KEKS_JSON="$PLATFORM_PROVIDER_CREDENTIAL_KEKS_JSON" \
            --from-literal=PLATFORM_PROVIDER_CREDENTIAL_FINGERPRINT_KEY="$PLATFORM_PROVIDER_CREDENTIAL_FINGERPRINT_KEY" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Sync dedicated Redis secrets
        env:
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          REDIS_RUNTIME_PASSWORD: ${{ secrets.REDIS_RUNTIME_PASSWORD }}
          REDIS_DLQ_PASSWORD: ${{ secrets.REDIS_DLQ_PASSWORD }}
        run: |
          runtime_password="${REDIS_RUNTIME_PASSWORD:-$REDIS_PASSWORD}"
          dlq_password="${REDIS_DLQ_PASSWORD:-$REDIS_PASSWORD}"

          kubectl -n "$NAMESPACE" create secret generic "$REDIS_RUNTIME_SECRET_NAME" \
            --from-literal=redis-password="$runtime_password" \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl -n "$NAMESPACE" create secret generic "$REDIS_DLQ_SECRET_NAME" \
            --from-literal=redis-password="$dlq_password" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Sync ClickHouse backup S3 secret
        env:
          CLICKHOUSE_BACKUP_S3_ACCESS_KEY: ${{ secrets.CLICKHOUSE_BACKUP_S3_ACCESS_KEY }}
          CLICKHOUSE_BACKUP_S3_SECRET_KEY: ${{ secrets.CLICKHOUSE_BACKUP_S3_SECRET_KEY }}
        run: |
          kubectl -n "$NAMESPACE" create secret generic "$CLICKHOUSE_BACKUP_SECRET_NAME" \
            --from-literal=endpoint="$CLICKHOUSE_BACKUP_S3_ENDPOINT" \
            --from-literal=region="$CLICKHOUSE_BACKUP_S3_REGION" \
            --from-literal=access-key="$CLICKHOUSE_BACKUP_S3_ACCESS_KEY" \
            --from-literal=secret-key="$CLICKHOUSE_BACKUP_S3_SECRET_KEY" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Sync fallback wildcard tenant TLS secret
        env:
          WILDCARD_GODARAI_IR_TLS_CRT: ${{ secrets.WILDCARD_GODARAI_IR_TLS_CRT }}
          WILDCARD_GODARAI_IR_TLS_KEY: ${{ secrets.WILDCARD_GODARAI_IR_TLS_KEY }}
        run: |
          if [ -z "$WILDCARD_GODARAI_IR_TLS_CRT" ] || [ -z "$WILDCARD_GODARAI_IR_TLS_KEY" ]; then
            echo "Wildcard TLS secrets are not configured; skipping wildcard-godarai-ir-tls."
            exit 0
          fi

          kubectl -n "$NAMESPACE" create secret tls wildcard-godarai-ir-tls \
            --cert=<(printf '%s' "$WILDCARD_GODARAI_IR_TLS_CRT") \
            --key=<(printf '%s' "$WILDCARD_GODARAI_IR_TLS_KEY") \
            --dry-run=client -o yaml | kubectl apply -f -
