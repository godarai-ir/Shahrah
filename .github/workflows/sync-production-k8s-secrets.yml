name: Sync Production Kubernetes Secrets

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-k8s-secrets
  cancel-in-progress: false

env:
  NAMESPACE: shahrah-production
  REGISTRY_SECRET_NAME: regcred
  APP_SECRET_NAME: shahrah-secret

jobs:
  sync:
    name: Sync production secrets
    runs-on: ubuntu-latest
    steps:
      - name: Validate required secrets
        run: |
          test -n "${{ secrets.KUBE_CONFIG_DATA }}"
          test -n "${{ secrets.REGISTRY_URL }}"
          test -n "${{ secrets.REGISTRY_USERNAME }}"
          test -n "${{ secrets.REGISTRY_PASSWORD }}"
          test -n "${{ secrets.DATABASE_URL }}"
          test -n "${{ secrets.MODEL_DISCOVERY_DATABASE_URL }}"
          test -n "${{ secrets.MASTER_KEY }}"
          test -n "${{ secrets.JWT_SECRET }}"
          test -n "${{ secrets.ARVANCLOUD_API_KEY }}"

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG_DATA }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Ensure namespace
        run: |
          kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
          kubectl create namespace ingress-nginx --dry-run=client -o yaml | kubectl apply -f -
          kubectl create namespace cert-manager --dry-run=client -o yaml | kubectl apply -f -

      - name: Sync image pull secret
        run: |
          kubectl -n "$NAMESPACE" create secret docker-registry "$REGISTRY_SECRET_NAME" \
            --docker-server="${{ secrets.REGISTRY_URL }}" \
            --docker-username="${{ secrets.REGISTRY_USERNAME }}" \
            --docker-password="${{ secrets.REGISTRY_PASSWORD }}" \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl -n ingress-nginx create secret docker-registry "$REGISTRY_SECRET_NAME" \
            --docker-server="${{ secrets.REGISTRY_URL }}" \
            --docker-username="${{ secrets.REGISTRY_USERNAME }}" \
            --docker-password="${{ secrets.REGISTRY_PASSWORD }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Sync ArvanCloud DNS API secret
        run: |
          kubectl -n cert-manager create secret generic arvancloud-api-key \
            --from-literal=apikey="${{ secrets.ARVANCLOUD_API_KEY }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Sync application secret
        run: |
          kubectl -n "$NAMESPACE" create secret generic "$APP_SECRET_NAME" \
            --from-literal=DATABASE_URL="${{ secrets.DATABASE_URL }}" \
            --from-literal=MODEL_DISCOVERY_DATABASE_URL="${{ secrets.MODEL_DISCOVERY_DATABASE_URL }}" \
            --from-literal=CLICKHOUSE_DSN="${{ secrets.CLICKHOUSE_DSN }}" \
            --from-literal=REDIS_PASSWORD="${{ secrets.REDIS_PASSWORD }}" \
            --from-literal=TYPESENSE_API_KEY="${{ secrets.TYPESENSE_API_KEY }}" \
            --from-literal=MASTER_KEY="${{ secrets.MASTER_KEY }}" \
            --from-literal=JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            --from-literal=OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}" \
            --from-literal=SHAHRAH_DISCOVERY_TOKEN="${{ secrets.SHAHRAH_DISCOVERY_TOKEN }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Sync fallback wildcard tenant TLS secret
        env:
          WILDCARD_GODARAI_IR_TLS_CRT: ${{ secrets.WILDCARD_GODARAI_IR_TLS_CRT }}
          WILDCARD_GODARAI_IR_TLS_KEY: ${{ secrets.WILDCARD_GODARAI_IR_TLS_KEY }}
        run: |
          if [ -z "$WILDCARD_GODARAI_IR_TLS_CRT" ] || [ -z "$WILDCARD_GODARAI_IR_TLS_KEY" ]; then
            echo "Wildcard TLS secrets are not configured; skipping wildcard-godarai-ir-tls."
            exit 0
          fi

          kubectl -n "$NAMESPACE" create secret tls wildcard-godarai-ir-tls \
            --cert=<(printf '%s' "$WILDCARD_GODARAI_IR_TLS_CRT") \
            --key=<(printf '%s' "$WILDCARD_GODARAI_IR_TLS_KEY") \
            --dry-run=client -o yaml | kubectl apply -f -
