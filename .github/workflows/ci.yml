name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GO_VERSION: "1.26.3"
  NODE_VERSION: "22"
  CONTROL_PLANE_DIR: services/control-plane

jobs:
  changes:
    name: Detect changed CI scopes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.detect.outputs.go }}
      tenant: ${{ steps.detect.outputs.tenant }}
      model: ${{ steps.detect.outputs.model }}
      javascript: ${{ steps.detect.outputs.javascript }}
      tenant_dom: ${{ steps.detect.outputs.tenant_dom }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Test change detectors
        run: python -m unittest discover -s scripts/ci -p "test_*.py"

      - name: Detect affected scopes
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: >-
          python scripts/ci/detect_ci_scopes.py
          --base-sha "$BASE_SHA"
          --head-sha "$HEAD_SHA"
          --github-output "$GITHUB_OUTPUT"

  # =============================================================================
  # Lint Job
  # =============================================================================
  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: ${{ env.CONTROL_PLANE_DIR }}/go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: ${{ env.CONTROL_PLANE_DIR }}
          args: >-
            --timeout=5m
            --max-issues-per-linter=0
            --max-same-issues=0

  # =============================================================================
  # Test Job
  # =============================================================================
  test:
    name: Test (${{ matrix.module }})
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: packages/contracts
            coverage_flag: contracts
            dependency_file: packages/contracts/go.mod
          - module: services/silk-road
            coverage_flag: silk-road
            dependency_file: services/silk-road/go.mod
          - module: services/control-plane
            coverage_flag: control-plane
            dependency_file: services/control-plane/go.sum
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: ${{ matrix.dependency_file }}

      - name: Download dependencies
        run: go mod download
        working-directory: ${{ matrix.module }}

      - name: Run go vet
        run: go vet ./...
        working-directory: ${{ matrix.module }}

      - name: Run full module tests
        run: go test -p=2 -v -race -shuffle=on -coverprofile=coverage.out -covermode=atomic ./...
        working-directory: ${{ matrix.module }}

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./${{ matrix.module }}/coverage.out
          flags: ${{ matrix.coverage_flag }}
          fail_ci_if_error: false

  # =============================================================================
  # JavaScript checks
  # =============================================================================
  javascript-checks:
    name: JavaScript checks
    needs: changes
    if: needs.changes.outputs.javascript == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        env:
          RUN_TENANT_CHECKS: ${{ needs.changes.outputs.tenant }}
          RUN_MODEL_CHECKS: ${{ needs.changes.outputs.model }}
        run: |
          filters=()
          if [[ "$RUN_TENANT_CHECKS" == "true" ]]; then
            filters+=(--filter "@shahrah/tenant-admin...")
          fi
          if [[ "$RUN_MODEL_CHECKS" == "true" ]]; then
            filters+=(--filter "model-discovery...")
          fi
          pnpm install --frozen-lockfile "${filters[@]}"

      - name: Run tenant-admin node tests
        if: needs.changes.outputs.tenant == 'true'
        run: pnpm --filter @shahrah/tenant-admin test:node

      - name: Run model-discovery tests
        if: needs.changes.outputs.model == 'true'
        run: pnpm --filter model-discovery test

      - name: Type-check model-discovery
        if: needs.changes.outputs.model == 'true'
        run: pnpm --filter model-discovery typecheck

  tenant-dom:
    name: Tenant DOM tests (${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.tenant_dom == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1/3, 2/3, 3/3]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @shahrah/tenant-admin...

      - name: Run tenant-admin DOM shard
        run: pnpm --filter @shahrah/tenant-admin test:dom -- --shard=${{ matrix.shard }}

  production-release:
    name: Production Release
    needs: [changes, lint, test, javascript-checks, tenant-dom]
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.changes.result == 'success' &&
      (needs.lint.result == 'success' || needs.lint.result == 'skipped') &&
      (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      (needs.javascript-checks.result == 'success' || needs.javascript-checks.result == 'skipped') &&
      (needs.tenant-dom.result == 'success' || needs.tenant-dom.result == 'skipped')
    permissions:
      contents: write
    uses: ./.github/workflows/gitops-production-release.yml
    with:
      head_sha: ${{ github.sha }}
    secrets:
      REGISTRY_URL: ${{ secrets.REGISTRY_URL }}
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
      GITOPS_REPO_TOKEN: ${{ secrets.GITOPS_REPO_TOKEN }}
