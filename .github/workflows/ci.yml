name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  GO_VERSION: "1.26.3"
  CONTROL_PLANE_DIR: services/control-plane

jobs:
  # =============================================================================
  # Lint Job
  # =============================================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: ${{ env.CONTROL_PLANE_DIR }}/go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.59
          working-directory: ${{ env.CONTROL_PLANE_DIR }}
          args: --timeout=5m

  # =============================================================================
  # Test Job
  # =============================================================================
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: ${{ env.CONTROL_PLANE_DIR }}/go.sum

      - name: Download dependencies
        run: go mod download
        working-directory: ${{ env.CONTROL_PLANE_DIR }}

      - name: Run full module tests
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...
        working-directory: ${{ env.CONTROL_PLANE_DIR }}

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./${{ env.CONTROL_PLANE_DIR }}/coverage.out
          flags: unit-tests
          fail_ci_if_error: false

  # =============================================================================
  # Build Job
  # =============================================================================
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test]
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: ${{ env.CONTROL_PLANE_DIR }}/go.sum

      - name: Download dependencies
        run: go mod download
        working-directory: ${{ env.CONTROL_PLANE_DIR }}

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
          BUILD_TIME=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          GIT_COMMIT=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")
          
          OUTPUT_DIR="bin/${{ matrix.goos }}-${{ matrix.goarch }}"
          mkdir -p "$OUTPUT_DIR"
          
          if [ "${{ matrix.goos }}" = "windows" ]; then
            EXT=".exe"
          else
            EXT=""
          fi
          
          CGO_ENABLED=0 go build \
            -ldflags "-s -w \
              -X main.Version=$VERSION \
              -X main.BuildTime=$BUILD_TIME \
              -X main.GitCommit=$GIT_COMMIT" \
            -o "$OUTPUT_DIR/go-llm-proxy$EXT" \
            ./cmd/server/
        working-directory: ${{ env.CONTROL_PLANE_DIR }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: go-llm-proxy-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ env.CONTROL_PLANE_DIR }}/bin/${{ matrix.goos }}-${{ matrix.goarch }}/
          retention-days: 7

  # =============================================================================
  # Docker Build Job
  # =============================================================================
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/shahrah-control-plane
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./services/control-plane
          file: ./services/control-plane/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =============================================================================
  # Release Job (only on tags)
  # =============================================================================
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: bin/

      - name: Generate release notes
        run: |
          git log $(git describe --tags --abbrev=0 HEAD^)..HEAD --pretty=format:"* %s (%h)" > RELEASE_NOTES.md 2>/dev/null || echo "No previous tag found, skipping changelog"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: bin/**/*
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
