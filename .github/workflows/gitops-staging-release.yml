name: Build Images And Propose Staging Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY_URL: ${{ secrets.ARVAN_REGISTRY_URL }}
  REGISTRY_NAMESPACE: ${{ secrets.ARVAN_REGISTRY_NAMESPACE }}
  IMAGE_TAG: sha-${{ github.sha }}
  GITOPS_REPO: Delpak/shahrah-gitops

jobs:
  build-and-push:
    name: Build And Push Images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: shahrah/control-plane
            context: .
            dockerfile: services/control-plane/Dockerfile
            target: ""
          - image: shahrah/model-discovery
            context: apps/model-discovery
            dockerfile: apps/model-discovery/Dockerfile
            target: ""
          - image: shahrah/model-discovery-migrate
            context: apps/model-discovery
            dockerfile: apps/model-discovery/Dockerfile
            target: migrate
          - image: shahrah/support-admin
            context: apps/support-admin
            dockerfile: apps/support-admin/Dockerfile
            target: ""
          - image: shahrah/silk-road
            context: .
            dockerfile: services/silk-road/Dockerfile
            target: ""
          - image: shahrah/tunnel-client
            context: services/tunnel-client
            dockerfile: services/tunnel-client/Dockerfile
            target: ""
          - image: shahrah/tunnel-server
            context: services/tunnel-server
            dockerfile: services/tunnel-server/Dockerfile
            target: ""
          - image: shahrah/goose
            context: .
            dockerfile: infra/compose/images/goose.Dockerfile
            target: ""
    steps:
      - name: Validate required secrets
        run: |
          test -n "${{ secrets.ARVAN_REGISTRY_URL }}"
          test -n "${{ secrets.ARVAN_REGISTRY_USERNAME }}"
          test -n "${{ secrets.ARVAN_REGISTRY_PASSWORD }}"
          test -n "${{ secrets.ARVAN_REGISTRY_NAMESPACE }}"

      - name: Checkout app repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to private registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_URL }}
          username: ${{ secrets.ARVAN_REGISTRY_USERNAME }}
          password: ${{ secrets.ARVAN_REGISTRY_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ env.REGISTRY_URL }}/${{ env.REGISTRY_NAMESPACE }}/${{ matrix.image }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-gitops-staging:
    name: Create GitOps Staging PR
    runs-on: ubuntu-latest
    needs: [build-and-push]
    permissions:
      contents: read
    steps:
      - name: Validate GitOps token
        run: test -n "${{ secrets.GITOPS_REPO_TOKEN }}"

      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_REPO_TOKEN }}
          path: gitops

      - name: Update staging imageTag
        working-directory: gitops
        run: |
          sed -i "s/^  imageTag: .*/  imageTag: \"${IMAGE_TAG}\"/" helm/shahrah/values.staging.yaml
          grep -n "imageTag" helm/shahrah/values.staging.yaml

      - name: Create pull request in GitOps repo
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITOPS_REPO_TOKEN }}
          path: gitops
          commit-message: "chore(staging): deploy ${IMAGE_TAG}"
          branch: "ci/staging-${{ github.sha }}"
          base: main
          title: "chore(staging): deploy ${IMAGE_TAG}"
          body: |
            Automated staging promotion from app repository commit `${{ github.sha }}`.

            - Built and pushed immutable image tags: `${{ env.IMAGE_TAG }}`
            - Updated `helm/shahrah/values.staging.yaml` global imageTag
          labels: |
            gitops
            staging

