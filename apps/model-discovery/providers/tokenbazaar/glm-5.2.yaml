model: glm-5.2
displayName: GLM-5.2
status: active
verified_at: 2026-08-17
api_format: zai
supportedModes: [chat]
modalities:
  input: [text]
  output: [text]
features:
  [
    function_calling,
    tool_choice,
    system_messages,
    prompt_caching,
    structured_output,
    json_output,
  ]
tools: [function_calling]
params:
  - key: reasoning_effort
    supportedValues: [none, minimal, low, medium, high, xhigh, max]
  - key: tool_stream
    type: boolean
  - key: tools
  - key: tool_choice
  - key: do_sample
    type: boolean
  - key: stream
    type: boolean
  - key: thinking
  - key: temperature
    minValue: 0
    maxValue: 1
  - key: top_p
    minValue: 0.01
    maxValue: 1
  - key: max_tokens
    minValue: 1
  - key: stop
    type: array-of-strings
  - key: response_format
  - key: request_id
  - key: user_id
costs:
  - region: '*'
    input_cost_per_token: 0.00000098
    output_cost_per_token: 0.00000308
    cache_read_input_token_cost: 0.000000182
limits:
  context_window: 1000000
  max_input_tokens: 1000000
  max_output_tokens: 128000
sources:
  - https://docs.z.ai/guides/llm/glm-5.2
  - https://docs.z.ai/guides/overview/pricing
  - https://docs.z.ai/api-reference/llm/chat-completion
  - https://docs.z.ai/guides/capabilities/thinking-mode
  - https://docs.z.ai/guides/capabilities/function-calling
  - https://tokenbazaar.ai/shelf?model=glm-5.2
runtimeProfile:
  version: 1
  aliases: []
  endpoints: [chat_completions]
  transports: [http, sse]
  lifecycle: active
  thinking:
    defaultMode: adaptive
    allowedModes: [adaptive, disabled]
    effortValues: [none, minimal, low, medium, high, xhigh, max]
  assistantPrefill: false
  sampling:
    parameters: [temperature, top_p]
  tools:
    custom: true
    parallel: false
    structuredOutput: true
    supported: [function_calling]
  modalities:
    input: [text]
    output: [text]
  parameters:
    chat_completions:
      [
        model,
        messages,
        do_sample,
        stream,
        thinking,
        reasoning_effort,
        temperature,
        top_p,
        max_tokens,
        tool_stream,
        tools,
        tool_choice,
        stop,
        response_format,
        request_id,
        user_id,
      ]
  unsupportedParameters:
    [
      parallel_tool_calls,
      service_tier,
      presence_penalty,
      frequency_penalty,
      logprobs,
      top_logprobs,
    ]
  limits:
    contextWindow: 1000000
    maxInputTokens: 1000000
    maxOutputTokens: 128000
