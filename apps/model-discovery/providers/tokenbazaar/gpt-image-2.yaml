costs:
    - region: "*"
      output_cost_per_image: 0.0371
features:
    - prompt_caching
modalities:
    input:
        - text
        - image
    output:
        - image
mode: image
model: gpt-image-2
params:
    - defaultValue: 128
      key: max_tokens
      maxValue: 4096
      minValue: 1
    - defaultValue: 0.8
      key: temperature
      maxValue: 2
      minValue: 0
    - defaultValue: null
      key: stop
      type: array-of-strings
    - defaultValue: 0.1
      key: top_p
      maxValue: 1
      minValue: 0
    - defaultValue: 1
      key: "n"
      maxValue: 10
      minValue: 1
provisioning: serverless
removeParams:
    - stream
    - tool_choice
    - parallel_tool_calls
    - reasoning_effort
sources:
    - https://developers.openai.com/api/docs/models/gpt-image-2
    - https://developers.openai.com/api/docs/guides/image-generation
    - https://developers.openai.com/api/docs/pricing
    - https://tokenbazaar.ai/shelf?model=gpt-image-2
snapshots:
    - gpt-image-2-2026-04-21
rateLimits:
    - tier: 1
      tokensPerMinute: 100000
      imagesPerMinute: 5
    - tier: 2
      tokensPerMinute: 250000
      imagesPerMinute: 20
    - tier: 3
      tokensPerMinute: 800000
      imagesPerMinute: 50
    - tier: 4
      tokensPerMinute: 3000000
      imagesPerMinute: 150
    - tier: 5
      tokensPerMinute: 8000000
      imagesPerMinute: 250
