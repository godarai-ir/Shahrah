model: gemini-3.6-flash
status: active
mode: chat
supportedModes: [chat, responses]
provisioning: serverless
modalities:
    input: [text, image, audio, video, pdf]
    output: [text]
limits:
    context_window: 1048576
    max_input_tokens: 1048576
    max_output_tokens: 65536
    max_tokens: 65536
features:
    - function_calling
    - parallel_function_calling
    - system_messages
    - tool_choice
    - prompt_caching
    - structured_output
    - code_execution
    - json_output
tools: [function_calling, google_search, google_maps, url_context, file_search, code_execution, computer_use, mcp]
endpoints: [models, interactions, generate_content, stream_generate_content, count_tokens, batches, batch_generate_content, files, cached_contents, chat_completions]
transports: [http, sse]
serviceTiers: [standard, batch, flex, priority]
thinkingProfile:
    defaultMode: manual
    allowedModes: [manual]
    manualDeprecated: false
    effortValues: [medium, high]
    reasoningModes: []
    contextValues: []
    alwaysEnabled: false
params:
    - key: max_tokens
      minValue: 1
      maxValue: 65536
    - key: stop
      type: array-of-strings
    - key: stream
      type: boolean
    - key: tool_choice
    - key: reasoning_effort
      defaultValue: medium
      supportedValues: [medium, high]
      type: string
removeParams: [temperature, top_p, top_k]
rateLimits: &geminiRateLimits
    - { usageTier: free, scope: project, dynamic: true, concurrentBatchRequests: 100, inputFileBytes: 2000000000, fileStorageBytes: 20000000000 }
    - { usageTier: tier_1, scope: project, dynamic: true, spendUsdPerTenMinutes: 10, batchQueueTokens: 3000000, concurrentBatchRequests: 100, inputFileBytes: 2000000000, fileStorageBytes: 20000000000 }
    - { usageTier: tier_2, scope: project, dynamic: true, spendUsdPerTenMinutes: 200, concurrentBatchRequests: 100, inputFileBytes: 2000000000, fileStorageBytes: 20000000000 }
    - { usageTier: tier_3, scope: project, dynamic: true, spendUsdPerTenMinutes: 200, concurrentBatchRequests: 100, inputFileBytes: 2000000000, fileStorageBytes: 20000000000 }
costs:
    - region: "*"
      input_cost_per_token: 0.000001425
      output_cost_per_token: 0.000007125
      cache_read_input_token_cost: 0.0000001425
sources:
    - https://ai.google.dev/gemini-api/docs/models/gemini-3.6-flash
    - https://ai.google.dev/gemini-api/docs/latest-model
    - https://ai.google.dev/gemini-api/docs/pricing
    - https://ai.google.dev/gemini-api/docs/rate-limits
    - https://ai.google.dev/gemini-api/docs/interactions-overview
    - https://tokenbazaar.ai/shelf?model=gemini-3.6-flash
runtimeProfile:
    version: 2
    endpoints: [models, interactions, generate_content, stream_generate_content, count_tokens, batches, batch_generate_content, files, cached_contents, chat_completions]
    transports: [http, sse]
    lifecycle: active
    thinking:
        defaultMode: manual
        allowedModes: [manual]
        manualDeprecated: false
        effortValues: [medium, high]
        reasoningModes: []
        contextValues: []
        alwaysEnabled: false
    assistantPrefill: false
    fineTuning: false
    predictedOutputs: false
    sampling:
        parameters: []
        disallowedWithThinking: [temperature, top_p, top_k]
    tools:
        custom: true
        server: true
        parallel: true
        structuredOutput: true
        supported: [function_calling, google_search, google_maps, url_context, file_search, code_execution, computer_use, mcp]
        preferredVersions: {}
    modalities:
        input: [text, image, audio, video, pdf]
        output: [text]
    requestControls:
        serviceTierValues: [standard, batch, flex, priority]
        inferenceGeoValues: [global]
        speedValues: []
        effectiveSpeed: {}
    betaHeaders: []
    betaCapabilities: []
    referenceRateLimits: *geminiRateLimits
    minimumRetentionDays: 0
    zdrEligible: false
    limits:
        contextWindow: 1048576
        maxInputTokens: 1048576
        maxOutputTokens: 65536
        messagesBytes: 33554432
        batchBytes: 2000000000
        fileBytes: 2000000000
