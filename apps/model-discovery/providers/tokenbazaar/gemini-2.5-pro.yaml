model: gemini-2.5-pro
status: active
mode: chat
supportedModes: [chat, generate_content]
provisioning: serverless
modalities:
  input: [text, image, audio, video, pdf]
  output: [text]
limits:
  {
    context_window: 1048576,
    max_input_tokens: 1048576,
    max_output_tokens: 65536,
    max_tokens: 65536,
  }
features:
  [
    function_calling,
    parallel_function_calling,
    system_messages,
    tool_choice,
    prompt_caching,
    structured_output,
    code_execution,
    json_output,
  ]
tools:
  [
    function_calling,
    google_search,
    google_maps,
    url_context,
    file_search,
    code_execution,
  ]
endpoints: [models, chat_completions, generate_content, stream_generate_content]
transports: [http, sse]
serviceTiers: [standard, batch, flex, priority]
thinkingProfile:
  defaultMode: adaptive
  allowedModes: [adaptive, manual]
  manualDeprecated: false
  effortValues: [low, medium, high]
  reasoningModes: []
  contextValues: []
  alwaysEnabled: false
params:
  - { key: max_tokens, minValue: 1, maxValue: 65536 }
  - { key: temperature, minValue: 0, maxValue: 2 }
  - { key: top_p, minValue: 0, maxValue: 1 }
  - { key: top_k, minValue: 0 }
  - { key: stop, type: array-of-strings }
  - { key: stream, type: boolean }
  - { key: tool_choice }
  - {
      key: reasoning_effort,
      supportedValues: [low, medium, high],
      type: string,
    }
rateLimits: &geminiRateLimits
  - {
      usageTier: free,
      scope: project,
      dynamic: true,
      concurrentBatchRequests: 100,
      inputFileBytes: 2000000000,
      fileStorageBytes: 20000000000,
    }
  - {
      usageTier: tier_1,
      scope: project,
      dynamic: true,
      spendUsdPerTenMinutes: 10,
      batchQueueTokens: 5000000,
      concurrentBatchRequests: 100,
      inputFileBytes: 2000000000,
      fileStorageBytes: 20000000000,
    }
  - {
      usageTier: tier_2,
      scope: project,
      dynamic: true,
      spendUsdPerTenMinutes: 200,
      batchQueueTokens: 500000000,
      concurrentBatchRequests: 100,
      inputFileBytes: 2000000000,
      fileStorageBytes: 20000000000,
    }
  - {
      usageTier: tier_3,
      scope: project,
      dynamic: true,
      spendUsdPerTenMinutes: 200,
      batchQueueTokens: 1000000000,
      concurrentBatchRequests: 100,
      inputFileBytes: 2000000000,
      fileStorageBytes: 20000000000,
    }
# Pricing pinned to the official Google Gemini rate (not TokenBazaar's live
# resale price) per explicit product decision on 2026-09-10 — see
# "Pricing anomalies" in plans/tokenbazaar-production-readiness.md.
costs:
  - region: '*'
    input_cost_per_token: 0.00000125
    output_cost_per_token: 0.00001
    cache_read_input_token_cost: 0.000000125
    cache_storage_cost_per_token_per_hour: 0.0000045
    input_cost_per_token_batches: 0.000000625
    output_cost_per_token_batches: 0.000005
    cache_read_input_token_cost_batches: 0.000000125
    cache_storage_cost_per_token_per_hour_batches: 0.0000045
    input_cost_per_token_flex: 0.000000625
    output_cost_per_token_flex: 0.000005
    cache_read_input_token_cost_flex: 0.000000125
    cache_storage_cost_per_token_per_hour_flex: 0.0000045
    input_cost_per_token_priority: 0.00000225
    output_cost_per_token_priority: 0.000018
    cache_read_input_token_cost_priority: 0.000000225
    cache_storage_cost_per_token_per_hour_priority: 0.0000081
    input_cost_per_token_batches_above_200k_tokens: 0.00000125
    output_cost_per_token_batches_above_200k_tokens: 0.0000075
    cache_read_input_token_cost_batches_above_200k_tokens: 0.00000025
    input_cost_per_token_flex_above_200k_tokens: 0.00000125
    output_cost_per_token_flex_above_200k_tokens: 0.0000075
    cache_read_input_token_cost_flex_above_200k_tokens: 0.00000025
    input_cost_per_token_priority_above_200k_tokens: 0.0000045
    output_cost_per_token_priority_above_200k_tokens: 0.000027
    cache_read_input_token_cost_priority_above_200k_tokens: 0.00000045
    tiered_pricing:
      pricing_mode: cumulative
      input: [{ from: 200000, cost_per_token: 0.0000025 }]
      output: [{ from: 200000, cost_per_token: 0.000015 }]
      cache_read: [{ from: 200000, cost_per_token: 0.00000025 }]
sources:
  - https://ai.google.dev/gemini-api/docs/models/gemini-2.5-pro
  - https://ai.google.dev/gemini-api/docs/pricing
  - https://ai.google.dev/gemini-api/docs/rate-limits
  - https://ai.google.dev/gemini-api/docs/generate-content/thinking
  - https://ai.google.dev/gemini-api/docs/interactions-overview
  - https://ai.google.dev/gemini-api/docs/deprecations
  - https://tokenbazaar.ai/shelf?model=gemini-2.5-pro
runtimeProfile:
  version: 3
  endpoints: [models, chat_completions, generate_content, stream_generate_content]
  transports: [http, sse]
  lifecycle: active
  thinking:
    defaultMode: adaptive
    allowedModes: [adaptive, manual]
    manualDeprecated: false
    effortValues: [low, medium, high]
    reasoningModes: []
    contextValues: []
    alwaysEnabled: false
  assistantPrefill: false
  fineTuning: false
  predictedOutputs: false
  sampling:
    parameters: [temperature, top_p, top_k]
    disallowedWithThinking: []
  tools:
    custom: true
    server: true
    parallel: true
    structuredOutput: true
    supported:
      [
        function_calling,
        google_search,
        google_maps,
        url_context,
        file_search,
        code_execution,
      ]
    preferredVersions: {}
  modalities:
    input: [text, image, audio, video, pdf]
    output: [text]
  requestControls:
    serviceTierValues: [standard, batch, flex, priority]
    inferenceGeoValues: [global]
    speedValues: []
    effectiveSpeed: {}
  betaHeaders: []
  betaCapabilities: []
  referenceRateLimits: *geminiRateLimits
  minimumRetentionDays: 0
  zdrEligible: false
  limits:
    contextWindow: 1048576
    maxInputTokens: 1048576
    maxOutputTokens: 65536
    messagesBytes: 33554432
    batchBytes: 2000000000
    fileBytes: 2000000000
