# Pricing pinned to the official OpenAI rate (not TokenBazaar's live resale
# price) per explicit product decision on 2026-09-10 — see "Pricing
# anomalies" in plans/tokenbazaar-production-readiness.md. Also note: the
# tiered_pricing.*.from threshold below is 272000 (OpenAI's official value),
# not the 278528 TokenBazaar itself displayed (a likely KiB->decimal
# conversion error on TokenBazaar's side, discovered during Phase 2-5).
costs:
    - cache_read_input_token_cost: 5e-7
      input_cost_per_token: 0.000005
      input_cost_per_token_batches: 0.0000025
      cache_read_input_token_cost_batches: 2.5e-7
      input_cost_per_token_flex: 0.0000025
      output_cost_per_token_flex: 0.000015
      cache_read_input_token_cost_flex: 2.5e-7
      output_cost_per_token: 0.00003
      output_cost_per_token_batches: 0.000015
      input_cost_per_token_batches_above_272k_tokens: 0.000005
      output_cost_per_token_batches_above_272k_tokens: 0.0000225
      cache_read_input_token_cost_batches_above_272k_tokens: 5e-7
      input_cost_per_token_flex_above_272k_tokens: 0.000005
      output_cost_per_token_flex_above_272k_tokens: 0.0000225
      cache_read_input_token_cost_flex_above_272k_tokens: 5e-7
      priority_pricing:
          cache_read_input_token_cost: 0.00000125
          input_cost_per_token: 0.0000125
          output_cost_per_token: 0.000075
      region: "*"
      tiered_pricing:
          cache_read:
              - cost_per_token: 0.000001
                from: 272000
          input:
              - cost_per_token: 0.00001
                from: 272000
          output:
              - cost_per_token: 0.000045
                from: 272000
          pricing_mode: cumulative
features:
    - function_calling
    - parallel_function_calling
    - tool_choice
    - system_messages
    - prompt_caching
    - structured_output
    - json_output
tools:
    - function_calling
    - web_search
    - file_search
    - tool_search
    - image_generation
    - code_interpreter
    - hosted_shell
    - apply_patch
    - skills
    - computer_use
    - mcp
serviceTiers:
    - standard
    - batch
    - flex
    - priority
    - fast
limits:
    context_window: 1050000
    max_output_tokens: 128000
    max_tokens: 128000
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: gpt-5.5
params:
    - defaultValue: 128
      key: max_completion_tokens
      maxValue: 128000
      minValue: 1
    - defaultValue: medium
      key: reasoning_effort
      supportedValues:
          - none
          - low
          - medium
          - high
          - xhigh
      type: string
    - defaultValue: 0.8
      key: temperature
      maxValue: 2
      minValue: 0
    - defaultValue: null
      key: stop
      type: array-of-strings
    - defaultValue: 0.1
      key: top_p
      maxValue: 1
      minValue: 0
    - defaultValue: 1
      key: "n"
      maxValue: 10
      minValue: 1
    - defaultValue: true
      key: stream
      type: boolean
    - defaultValue: null
      key: tool_choice
    - defaultValue: true
      key: parallel_tool_calls
      type: boolean
provisioning: serverless
removeParams:
    - max_tokens
sources:
    - https://developers.openai.com/api/docs/models/gpt-5.5
    - https://developers.openai.com/api/docs/pricing
    - https://tokenbazaar.ai/shelf?model=gpt-5.5
status: active
supportedModes:
    - chat
    - responses
thinking: true
runtimeProfile:
    version: 3
    endpoints:
        - models
        - chat_completions
        - responses
        - responses_input_tokens
        - responses_compact
        - conversations
        - uploads
        - vector_stores
        - containers
        - batches
    transports:
        - http
        - sse
    lifecycle: active
    thinking:
        defaultMode: manual
        allowedModes:
            - manual
        manualDeprecated: false
        effortValues:
            - none
            - low
            - medium
            - high
            - xhigh
        reasoningModes: []
        contextValues: []
        alwaysEnabled: false
    assistantPrefill: false
    fineTuning: false
    predictedOutputs: false
    sampling:
        parameters:
            - temperature
            - top_p
        disallowedWithThinking: []
    tools:
        custom: true
        server: true
        parallel: true
        structuredOutput: true
        supported:
            - function_calling
            - web_search
            - file_search
            - tool_search
            - image_generation
            - code_interpreter
            - hosted_shell
            - apply_patch
            - skills
            - computer_use
            - mcp
        preferredVersions: {}
    modalities:
        input:
            - text
            - image
        output:
            - text
    requestControls:
        serviceTierValues:
            - standard
            - batch
            - flex
            - priority
            - fast
        inferenceGeoValues:
            - global
        speedValues: []
        effectiveSpeed: {}
    betaHeaders: []
    betaCapabilities: []
    referenceRateLimits: []
    minimumRetentionDays: 0
    zdrEligible: false
    limits:
        contextWindow: 1050000
        maxInputTokens: 0
        maxInputCharacters: 0
        maxInputBytes: 0
        maxOutputTokens: 128000
        messagesBytes: 33554432
        batchBytes: 268435456
        fileBytes: 524288000
