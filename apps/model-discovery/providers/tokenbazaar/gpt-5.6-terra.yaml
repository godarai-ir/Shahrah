costs:
    - region: "*"
      input_cost_per_token: 0.0000019
      output_cost_per_token: 0.0000171
      cache_read_input_token_cost: 0.00000019
      cache_creation_input_token_cost: 0.000002375
features:
    - function_calling
    - system_messages
    - tool_choice
    - prompt_caching
    - structured_output
tools:
    - function_calling
    - web_search
    - file_search
    - tool_search
    - image_generation
    - code_interpreter
    - hosted_shell
    - apply_patch
    - skills
    - computer_use
    - mcp
serviceTiers:
    - standard
    - batch
    - flex
    - priority
    - fast
limits:
    context_window: 1050000
    max_input_tokens: 1050000
    max_output_tokens: 128000
    max_tokens: 128000
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: gpt-5.6-terra
params:
    - defaultValue: 128
      key: max_completion_tokens
      maxValue: 128000
      minValue: 1
    - defaultValue: medium
      key: reasoning_effort
      supportedValues:
          - none
          - low
          - medium
          - high
          - xhigh
          - max
      type: string
    - defaultValue: 0.8
      key: temperature
      maxValue: 2
      minValue: 0
    - defaultValue: null
      key: stop
      type: array-of-strings
    - defaultValue: 0.1
      key: top_p
      maxValue: 1
      minValue: 0
    - defaultValue: 1
      key: "n"
      maxValue: 10
      minValue: 1
    - defaultValue: true
      key: stream
      type: boolean
    - defaultValue: null
      key: tool_choice
    - defaultValue: true
      key: parallel_tool_calls
      type: boolean
provisioning: serverless
removeParams:
    - max_tokens
sources:
    - https://developers.openai.com/api/docs/models/gpt-5.6-terra
    - https://developers.openai.com/api/docs/pricing
    - https://tokenbazaar.ai/shelf?model=gpt-5.6-terra
status: active
supportedModes:
    - chat
    - responses
thinking: true
runtimeProfile:
    version: 3
    endpoints:
        - models
        - chat_completions
        - responses
        - responses_input_tokens
        - responses_compact
        - conversations
        - uploads
        - vector_stores
        - containers
        - batches
    transports:
        - http
        - sse
    lifecycle: active
    thinking:
        defaultMode: manual
        allowedModes:
            - manual
        manualDeprecated: false
        effortValues:
            - none
            - low
            - medium
            - high
            - xhigh
            - max
        reasoningModes:
            - standard
            - pro
        contextValues:
            - auto
            - current_turn
            - all_turns
        alwaysEnabled: false
    assistantPrefill: false
    fineTuning: false
    predictedOutputs: false
    sampling:
        parameters:
            - temperature
            - top_p
        disallowedWithThinking: []
    tools:
        custom: true
        server: true
        parallel: false
        structuredOutput: true
        supported:
            - function_calling
            - web_search
            - file_search
            - tool_search
            - image_generation
            - code_interpreter
            - hosted_shell
            - apply_patch
            - skills
            - computer_use
            - mcp
        preferredVersions: {}
    modalities:
        input:
            - text
            - image
        output:
            - text
    requestControls:
        serviceTierValues:
            - standard
            - batch
            - flex
            - priority
            - fast
        inferenceGeoValues:
            - global
        speedValues: []
        effectiveSpeed: {}
    betaHeaders: []
    betaCapabilities: []
    referenceRateLimits: []
    minimumRetentionDays: 0
    zdrEligible: false
    limits:
        contextWindow: 1050000
        maxInputTokens: 1050000
        maxInputCharacters: 0
        maxInputBytes: 0
        maxOutputTokens: 128000
        messagesBytes: 33554432
        batchBytes: 268435456
        fileBytes: 524288000
