# Pricing pinned to the official OpenAI rate (not TokenBazaar's live resale
# price) per explicit product decision on 2026-09-10 — see "Pricing
# anomalies" in plans/tokenbazaar-production-readiness.md. This corrects the
# +42.5% output-price premium TokenBazaar was charging on this model.
costs:
    - cache_creation_input_token_cost: 0.0000025
      cache_read_input_token_cost: 2e-7
      input_cost_per_token: 0.000002
      input_cost_per_token_batches: 0.000001
      cache_creation_input_token_cost_batches: 0.00000125
      cache_read_input_token_cost_batches: 1e-7
      input_cost_per_token_flex: 0.000001
      output_cost_per_token_flex: 0.000006
      cache_creation_input_token_cost_flex: 0.00000125
      cache_read_input_token_cost_flex: 1e-7
      output_cost_per_token: 0.000012
      output_cost_per_token_batches: 0.000006
      input_cost_per_token_batches_above_272k_tokens: 0.000002
      output_cost_per_token_batches_above_272k_tokens: 0.000009
      cache_creation_input_token_cost_batches_above_272k_tokens: 0.0000025
      cache_read_input_token_cost_batches_above_272k_tokens: 2e-7
      input_cost_per_token_flex_above_272k_tokens: 0.000002
      output_cost_per_token_flex_above_272k_tokens: 0.000009
      cache_creation_input_token_cost_flex_above_272k_tokens: 0.0000025
      cache_read_input_token_cost_flex_above_272k_tokens: 2e-7
      priority_pricing:
          cache_creation_input_token_cost: 0.000005
          cache_read_input_token_cost: 4e-7
          input_cost_per_token: 0.000004
          output_cost_per_token: 0.000024
      region: "*"
      tiered_pricing:
          cache_read:
              - cost_per_token: 4e-7
                from: 272000
          cache_write:
              - cost_per_token: 0.000005
                from: 272000
          input:
              - cost_per_token: 0.000004
                from: 272000
          output:
              - cost_per_token: 0.000018
                from: 272000
          pricing_mode: cumulative
features:
    - function_calling
    - system_messages
    - tool_choice
    - prompt_caching
    - structured_output
tools:
    - function_calling
    - web_search
    - file_search
    - tool_search
    - image_generation
    - code_interpreter
    - hosted_shell
    - apply_patch
    - skills
    - computer_use
    - mcp
serviceTiers:
    - standard
    - batch
    - flex
    - priority
    - fast
limits:
    context_window: 1050000
    max_input_tokens: 1050000
    max_output_tokens: 128000
    max_tokens: 128000
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: gpt-5.6-terra
params:
    - defaultValue: 128
      key: max_completion_tokens
      maxValue: 128000
      minValue: 1
    - defaultValue: medium
      key: reasoning_effort
      supportedValues:
          - none
          - low
          - medium
          - high
          - xhigh
          - max
      type: string
    - defaultValue: 0.8
      key: temperature
      maxValue: 2
      minValue: 0
    - defaultValue: null
      key: stop
      type: array-of-strings
    - defaultValue: 0.1
      key: top_p
      maxValue: 1
      minValue: 0
    - defaultValue: 1
      key: "n"
      maxValue: 10
      minValue: 1
    - defaultValue: true
      key: stream
      type: boolean
    - defaultValue: null
      key: tool_choice
    - defaultValue: true
      key: parallel_tool_calls
      type: boolean
provisioning: serverless
removeParams:
    - max_tokens
sources:
    - https://developers.openai.com/api/docs/models/gpt-5.6-terra
    - https://developers.openai.com/api/docs/pricing
status: active
supportedModes:
    - chat
    - responses
thinking: true
runtimeProfile:
    version: 3
    endpoints:
        - models
        - chat_completions
        - responses
        - responses_input_tokens
        - responses_compact
        - conversations
        - uploads
        - vector_stores
        - containers
        - batches
    transports:
        - http
        - sse
    lifecycle: active
    thinking:
        defaultMode: manual
        allowedModes:
            - manual
        manualDeprecated: false
        effortValues:
            - none
            - low
            - medium
            - high
            - xhigh
            - max
        reasoningModes:
            - standard
            - pro
        contextValues:
            - auto
            - current_turn
            - all_turns
        alwaysEnabled: false
    assistantPrefill: false
    fineTuning: false
    predictedOutputs: false
    sampling:
        parameters:
            - temperature
            - top_p
        disallowedWithThinking: []
    tools:
        custom: true
        server: true
        parallel: false
        structuredOutput: true
        supported:
            - function_calling
            - web_search
            - file_search
            - tool_search
            - image_generation
            - code_interpreter
            - hosted_shell
            - apply_patch
            - skills
            - computer_use
            - mcp
        preferredVersions: {}
    modalities:
        input:
            - text
            - image
        output:
            - text
    requestControls:
        serviceTierValues:
            - standard
            - batch
            - flex
            - priority
            - fast
        inferenceGeoValues:
            - global
        speedValues: []
        effectiveSpeed: {}
    betaHeaders: []
    betaCapabilities: []
    referenceRateLimits: []
    minimumRetentionDays: 0
    zdrEligible: false
    limits:
        contextWindow: 1050000
        maxInputTokens: 1050000
        maxInputCharacters: 0
        maxInputBytes: 0
        maxOutputTokens: 128000
        messagesBytes: 33554432
        batchBytes: 268435456
        fileBytes: 524288000
