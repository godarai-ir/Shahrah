model: glm-4.7-flashx
displayName: GLM-4.7-FlashX
status: active
verified_at: 2026-08-17
api_format: zai
supportedModes: [chat]
modalities:
  input: [text]
  output: [text]
features:
  [
    function_calling,
    tool_choice,
    system_messages,
    prompt_caching,
    structured_output,
    json_output,
  ]
tools: [function_calling]
params:
  - key: tool_stream
    type: boolean
  - key: tools
  - key: tool_choice
costs:
  - region: '*'
    effective_from: 2026-08-17
    input_cost_per_token: 0.00000007
    cache_read_input_token_cost: 0.00000001
    output_cost_per_token: 0.0000004
limits:
  context_window: 200000
  max_input_tokens: 200000
  max_output_tokens: 128000
sources:
  - https://docs.z.ai/guides/llm/glm-4.7
  - https://docs.z.ai/guides/overview/pricing
  - https://docs.z.ai/api-reference/llm/chat-completion
  - https://docs.z.ai/guides/capabilities/function-calling
runtimeProfile:
  version: 1
  aliases: []
  endpoints: [chat_completions]
  transports: [http, sse]
  lifecycle: active
  thinking:
    defaultMode: adaptive
    allowedModes: [adaptive, disabled]
  assistantPrefill: false
  sampling:
    parameters: [temperature, top_p]
  tools:
    custom: true
    parallel: false
    structuredOutput: true
    supported: [function_calling]
  modalities:
    input: [text]
    output: [text]
  parameters:
    chat_completions:
      [
        model,
        messages,
        do_sample,
        stream,
        thinking,
        temperature,
        top_p,
        max_tokens,
        tool_stream,
        tools,
        tool_choice,
        stop,
        response_format,
        request_id,
        user_id,
      ]
  unsupportedParameters:
    [
      reasoning_effort,
      parallel_tool_calls,
      service_tier,
      presence_penalty,
      frequency_penalty,
      logprobs,
      top_logprobs,
    ]
  limits:
    contextWindow: 200000
    maxInputTokens: 200000
    maxOutputTokens: 128000
