model: glm-5.3-flash
displayName: GLM-5.3-Flash
status: active
verified_at: 2026-09-11
api_format: zai
supportedModes: [chat]
modalities:
  input: [text, image, video, document]
  output: [text]
features:
  [
    function_calling,
    tool_choice,
    system_messages,
    prompt_caching,
    structured_output,
    json_output,
  ]
tools: [function_calling]
params:
  - key: reasoning_effort
    supportedValues: [none, minimal, low, medium, high, xhigh, max]
  - key: tool_stream
    type: boolean
  - key: tools
  - key: tool_choice
costs:
  - region: '*'
    effective_from: 2026-09-11
    input_cost_per_token: 0.00000015
    cache_read_input_token_cost: 0.00000003
    output_cost_per_token: 0.0000005
limits:
  context_window: 1000000
  max_input_tokens: 1000000
  max_output_tokens: 128000
sources:
  - https://docs.z.ai/guides/vlm/glm-5.3-flash
  - https://docs.z.ai/guides/overview/pricing
  - https://docs.z.ai/api-reference/llm/chat-completion
  - https://docs.z.ai/guides/capabilities/thinking-mode
  - https://docs.z.ai/guides/capabilities/function-calling
  - https://docs.z.ai/openapi.json
runtimeProfile:
  version: 1
  aliases: []
  endpoints: [chat_completions]
  transports: [http, sse]
  lifecycle: active
  thinking:
    defaultMode: adaptive
    allowedModes: [adaptive]
    alwaysEnabled: true
    effortValues: [none, minimal, low, medium, high, xhigh, max]
  assistantPrefill: false
  sampling:
    parameters: [temperature, top_p]
  tools:
    custom: true
    parallel: false
    structuredOutput: true
    supported: [function_calling]
  modalities:
    input: [text, image, video, document]
    output: [text]
  parameters:
    chat_completions:
      [
        model,
        messages,
        do_sample,
        stream,
        thinking,
        reasoning_effort,
        temperature,
        top_p,
        max_tokens,
        tool_stream,
        tools,
        tool_choice,
        stop,
        response_format,
        request_id,
        user_id,
      ]
  unsupportedParameters:
    [
      parallel_tool_calls,
      service_tier,
      presence_penalty,
      frequency_penalty,
      logprobs,
      top_logprobs,
    ]
  limits:
    contextWindow: 1000000
    maxInputTokens: 1000000
    maxOutputTokens: 128000
    fileBytes: 209715200
