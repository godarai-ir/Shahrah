costs:
    - cache_read_input_token_cost: 5e-7
      input_cost_per_token: 0.000002
      input_cost_per_token_batches: 0.000001
      output_cost_per_token: 0.000008
      output_cost_per_token_batches: 0.000004
      priority_pricing:
          cache_read_input_token_cost: 8.75e-7
          input_cost_per_token: 0.0000035
          output_cost_per_token: 0.000014
      region: "*"
features:
    - fine_tuning
    - function_calling
    - parallel_function_calling
    - system_messages
    - tool_choice
    - prompt_caching
    - predicted_outputs
    - structured_output
    - json_output
tools:
    - function_calling
    - web_search
    - file_search
    - image_generation
    - code_interpreter
    - mcp
serviceTiers:
    - standard
    - batch
    - priority
    - fast
limits:
    context_window: 1047576
    max_input_tokens: 1047576
    max_output_tokens: 32768
    max_tokens: 32768
modalities:
    input:
        - text
        - image
        - pdf
    output:
        - text
mode: chat
model: gpt-4.1
params:
    - defaultValue: 1000
      key: max_completion_tokens
      maxValue: 32768
      minValue: 1
    - defaultValue: null
      key: response_format
      type: string
provisioning: serverless
removeParams:
    - max_tokens
    - reasoning_effort
sources:
    - https://developers.openai.com/api/docs/models/gpt-4.1
    - https://developers.openai.com/api/docs/pricing
snapshots:
    - gpt-4.1-2025-04-14
rateLimits:
    - tier: 1
      requestsPerMinute: 500
      tokensPerMinute: 30000
      batchQueueTokens: 90000
    - tier: 2
      requestsPerMinute: 5000
      tokensPerMinute: 450000
      batchQueueTokens: 1350000
    - tier: 3
      requestsPerMinute: 5000
      tokensPerMinute: 800000
      batchQueueTokens: 50000000
    - tier: 4
      requestsPerMinute: 10000
      tokensPerMinute: 2000000
      batchQueueTokens: 200000000
    - tier: 5
      requestsPerMinute: 10000
      tokensPerMinute: 30000000
      batchQueueTokens: 5000000000
status: active
supportedModes:
    - chat
    - responses
