costs:
    - input_cost_per_token: 2e-8
      input_cost_per_token_batches: 1e-8
      output_cost_per_token: 0
      output_cost_per_token_batches: 0
      region: "*"
limits:
    max_input_tokens: 8192
    output_vector_size: 1536
params:
    - key: dimensions
      minValue: 1
      maxValue: 1536
    - key: encoding_format
      supportedValues:
          - float
          - base64
      type: string
    - key: user
      type: string
modalities:
    input:
        - text
    output:
        - embedding
mode: embedding
model: text-embedding-3-small
provisioning: serverless
removeParams:
    - temperature
    - stop
    - top_p
    - "n"
    - stream
    - tool_choice
    - parallel_tool_calls
    - max_tokens
    - reasoning_effort
sources:
    - https://developers.openai.com/api/docs/guides/embeddings
    - https://developers.openai.com/api/docs/models/text-embedding-3-small
    - https://developers.openai.com/api/docs/pricing
snapshots:
    - text-embedding-3-small
rateLimits:
    - tier: 1
      requestsPerMinute: 3000
      tokensPerMinute: 1000000
      batchQueueTokens: 3000000
    - tier: 2
      requestsPerMinute: 5000
      tokensPerMinute: 1000000
      batchQueueTokens: 20000000
    - tier: 3
      requestsPerMinute: 5000
      tokensPerMinute: 5000000
      batchQueueTokens: 100000000
    - tier: 4
      requestsPerMinute: 10000
      tokensPerMinute: 5000000
      batchQueueTokens: 500000000
    - tier: 5
      requestsPerMinute: 10000
      tokensPerMinute: 10000000
      batchQueueTokens: 4000000000
status: active
supportedModes:
    - embedding
