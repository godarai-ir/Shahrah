costs:
    - cache_read_input_token_cost: 2.5e-7
      input_cost_per_token: 0.0000025
      input_cost_per_token_batches: 0.00000125
      cache_read_input_token_cost_batches: 1.3e-7
      input_cost_per_token_flex: 0.00000125
      output_cost_per_token_flex: 0.0000075
      cache_read_input_token_cost_flex: 1.3e-7
      output_cost_per_token: 0.000015
      output_cost_per_token_batches: 0.0000075
      input_cost_per_token_batches_above_272k_tokens: 0.0000025
      output_cost_per_token_batches_above_272k_tokens: 0.00001125
      cache_read_input_token_cost_batches_above_272k_tokens: 2.5e-7
      input_cost_per_token_flex_above_272k_tokens: 0.0000025
      output_cost_per_token_flex_above_272k_tokens: 0.00001125
      cache_read_input_token_cost_flex_above_272k_tokens: 2.5e-7
      priority_pricing:
          cache_read_input_token_cost: 5e-7
          input_cost_per_token: 0.000005
          output_cost_per_token: 0.00003
      region: "*"
      tiered_pricing:
          cache_read:
              - cost_per_token: 5e-7
                from: 272000
          input:
              - cost_per_token: 0.000005
                from: 272000
          output:
              - cost_per_token: 0.0000225
                from: 272000
          pricing_mode: cumulative
features:
    - function_calling
    - parallel_function_calling
    - tool_choice
    - system_messages
    - structured_output
    - prompt_caching
    - json_output
tools:
    - function_calling
    - web_search
    - file_search
    - tool_search
    - image_generation
    - code_interpreter
    - hosted_shell
    - apply_patch
    - skills
    - computer_use
    - mcp
serviceTiers:
    - standard
    - batch
    - flex
    - priority
    - fast
limits:
    context_window: 1050000
    max_output_tokens: 128000
    max_tokens: 128000
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: gpt-5.4
params:
    - defaultValue: 128
      key: max_completion_tokens
      maxValue: 128000
      minValue: 1
    - defaultValue: none
      key: reasoning_effort
      supportedValues:
          - none
          - low
          - medium
          - high
          - xhigh
      type: string
provisioning: serverless
removeParams:
    - max_tokens
sources:
    - https://developers.openai.com/api/docs/models/gpt-5.4
status: active
supportedModes:
    - chat
    - responses
thinking: true
