costs:
    - cache_read_input_token_cost: 7.5e-8
      input_cost_per_token: 1.5e-7
      input_cost_per_token_batches: 7.5e-8
      output_cost_per_token: 6e-7
      output_cost_per_token_batches: 3e-7
      priority_pricing:
          cache_read_input_token_cost: 1.25e-7
          input_cost_per_token: 2.5e-7
          output_cost_per_token: 0.000001
      region: "*"
features:
    - fine_tuning
    - function_calling
    - parallel_function_calling
    - system_messages
    - tool_choice
    - prompt_caching
    - predicted_outputs
    - structured_output
    - json_output
tools:
    - function_calling
    - web_search
    - file_search
    - image_generation
    - code_interpreter
    - mcp
serviceTiers:
    - standard
    - batch
    - priority
    - fast
limits:
    context_window: 128000
    max_input_tokens: 128000
    max_output_tokens: 16384
    max_tokens: 16384
modalities:
    input:
        - text
        - image
    output:
        - text
mode: chat
model: gpt-4o-mini
params:
    - key: max_tokens
      maxValue: 16384
    - defaultValue: null
      key: response_format
      type: string
provisioning: serverless
removeParams:
    - reasoning_effort
sources:
    - https://developers.openai.com/api/docs/models/gpt-4o-mini
    - https://developers.openai.com/api/docs/pricing
snapshots:
    - gpt-4o-mini-2024-07-18
rateLimits:
    - tier: 1
      requestsPerMinute: 500
      requestsPerDay: 10000
      tokensPerMinute: 200000
      batchQueueTokens: 2000000
    - tier: 2
      requestsPerMinute: 5000
      tokensPerMinute: 2000000
      batchQueueTokens: 20000000
    - tier: 3
      requestsPerMinute: 5000
      tokensPerMinute: 4000000
      batchQueueTokens: 40000000
    - tier: 4
      requestsPerMinute: 10000
      tokensPerMinute: 10000000
      batchQueueTokens: 1000000000
    - tier: 5
      requestsPerMinute: 30000
      tokensPerMinute: 150000000
      batchQueueTokens: 15000000000
status: active
supportedModes:
    - chat
    - responses
