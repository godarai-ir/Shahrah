documentation:
    - https://ai.google.dev/gemini-api/docs
    - https://ai.google.dev/gemini-api/docs/deprecations
    - https://ai.google.dev/gemini-api/docs/pricing#standard
    - https://ai.google.dev/gemini-api/docs/pricing#batch
    - https://ai.google.dev/gemini-api/docs/models
    - https://ai.google.dev/gemini-api/docs/changelog
    - https://ai.google.dev/gemini-api/docs/thinking#thinking-levels
    - https://ai.google.dev/gemini-api/docs/interactions-overview
    - https://ai.google.dev/gemini-api/docs/openai
    - https://ai.google.dev/gemini-api/docs/rate-limits
    - https://ai.google.dev/gemini-api/docs/api-key
    - https://ai.google.dev/gemini-api/docs/oauth
messages:
    options:
        - user
        - assistant
params:
    - defaultValue: 256
      key: max_tokens
      maxValue: 65536
      minValue: 1
    - defaultValue: 0.7
      key: temperature
      maxValue: 2
      minValue: 0
    - defaultValue: 1
      key: top_p
      maxValue: 1
      minValue: 0
    - defaultValue: 40
      key: top_k
      maxValue: 100
      minValue: 0
    - defaultValue: null
      key: stop
      type: array-of-strings
    - defaultValue: true
      key: stream
      type: boolean
    - defaultValue: null
      key: tool_choice
    - defaultValue: medium
      key: reasoning_effort
      supportedValues:
          - minimal
          - low
          - medium
          - high
      type: string
tool_pricing:
    web_search:
        billing_basis: actual_queries
        free_monthly_queries: 5000
        per_thousand_requests: 14
        source: https://ai.google.dev/gemini-api/docs/pricing#search-grounding
    google_maps:
        billing_basis: actual_queries
        free_monthly_queries: 5000
        per_thousand_requests: 14
        source: https://ai.google.dev/gemini-api/docs/pricing#google-maps-grounding
