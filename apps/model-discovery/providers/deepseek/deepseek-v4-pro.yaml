model: deepseek-v4-pro
status: preview
verified_at: 2026-08-05
api_format: openai
lifecycle_note: API-accessible preview; official release evidence pending
supportedModes: [chat]
modalities:
  input: [text]
  output: [text]
features:
  - function_calling
  - tool_choice
  - system_messages
  - prompt_caching
  - structured_output
  - json_output
tools: [function_calling]
params:
  - key: reasoning_effort
    defaultValue: high
    supportedValues: [low, high, xhigh, max]
  - key: max_tokens
    maxValue: 393216
costs:
  - region: '*'
    effective_from: 2026-08-05
    input_cost_per_token: 0.000000435
    cache_read_input_token_cost: 0.000000003625
    output_cost_per_token: 0.00000087
limits:
  context_window: 1048576
  max_input_tokens: 1048576
  max_output_tokens: 393216
sources:
  - https://api-docs.deepseek.com/quick_start/pricing
  - https://api-docs.deepseek.com/api/list-models
  - https://api-docs.deepseek.com/api/create-chat-completion
  - https://api-docs.deepseek.com/guides/thinking_mode
  - https://api-docs.deepseek.com/guides/tool_calls
  - https://api-docs.deepseek.com/guides/json_mode
  - https://api-docs.deepseek.com/guides/kv_cache
  - https://api-docs.deepseek.com/updates
runtimeProfile:
  version: 1
  aliases: []
  endpoints: [models, chat_completions]
  transports: [http, sse]
  lifecycle: preview
  thinking:
    defaultMode: adaptive
    allowedModes: [adaptive, disabled]
    manualDeprecated: false
    effortValues: [low, high, xhigh, max]
  assistantPrefill: false
  sampling:
    parameters: [temperature, top_p]
    disallowedWithThinking: [temperature, top_p]
  tools:
    custom: true
    server: false
    parallel: false
    structuredOutput: true
    supported: [function_calling]
  modalities:
    input: [text]
    output: [text]
  unsupportedParameters:
    - max_completion_tokens
    - parallel_tool_calls
    - top_k
    - service_tier
    - speed
    - inference_geo
    - strict
    - prefix
  minimumRetentionDays: 0
  zdrEligible: false
  limits:
    contextWindow: 1048576
    maxInputTokens: 1048576
    maxOutputTokens: 393216
