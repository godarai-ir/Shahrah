costs:
    - cache_creation_input_token_cost: 0.00000125
      cache_creation_input_token_cost_per_hour: 0.000002
      cache_read_input_token_cost: 1e-7
      input_cost_per_token: 0.000001
      input_cost_per_token_batches: 5e-7
      output_cost_per_token: 0.000005
      output_cost_per_token_batches: 0.0000025
      region: "*"
features:
    - function_calling
    - parallel_function_calling
    - tool_choice
    - prompt_caching
    - cache_control
    - system_messages
    - structured_output
    - assistant_prefill
limits:
    context_window: 200000
    max_input_tokens: 200000
    max_output_tokens: 64000
    max_tokens: 64000
    tool_use_system_prompt_tokens: 496
modalities:
    input:
        - text
        - image
        - pdf
    output:
        - text
mode: chat
model: claude-haiku-4-5-20251001
params:
    - key: max_tokens
      maxValue: 64000
    - defaultValue: null
      key: thinking
provisioning: serverless
removeParams:
    - top_p
    - reasoning_effort
retirementDate: "2026-10-15"
status: active
supportedModes:
    - chat
thinking: true
runtimeProfile:
    version: 1
    endpoints: [messages, count_tokens, message_batches, files, models]
    thinking:
        defaultMode: manual
        allowedModes: [manual, disabled]
        manualDeprecated: false
        effortValues: []
    assistantPrefill: true
    sampling:
        parameters: [temperature, top_p, top_k]
        disallowedWithThinking: [temperature, top_p, top_k]
    tools:
        custom: true
        server: true
        parallel: true
        structuredOutput: true
    modalities:
        input: [text, image, pdf]
        output: [text]
    betaHeaders: [files-api-2025-04-14]
    limits:
        contextWindow: 200000
        maxOutputTokens: 64000
        messagesBytes: 33554432
        batchBytes: 268435456
        fileBytes: 524288000
