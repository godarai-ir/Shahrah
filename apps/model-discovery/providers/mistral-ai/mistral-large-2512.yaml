model: mistral-large-2512
status: active
mode: chat
supportedModes: [chat]
provisioning: serverless
costs:
  - region: "*"
    input_cost_per_token: 0.0000005
    output_cost_per_token: 0.0000015
    cache_read_input_token_cost: 0.00000005
    input_cost_per_token_batches: 0.00000025
    output_cost_per_token_batches: 0.00000075
features: [function_calling, parallel_function_calling, structured_output, json_output, tool_choice, system_messages, assistant_prefill, prompt_caching, document_qna, agents, built_in_tools]
limits:
  context_window: 262144
modalities:
  input: [text, image, pdf, doc]
  output: [text]
sources:
  - https://docs.mistral.ai/models/model-cards/mistral-large-3-25-12
runtimeProfile:
  version: 2
  aliases: [mistral-large-latest]
  endpoints: [chat_completions, conversations, agents, files, batches]
  transports: [http, sse]
  lifecycle: active
  thinking:
    defaultMode: disabled
    allowedModes: [disabled]
  assistantPrefill: true
  sampling:
    parameters: [temperature, top_p]
  tools:
    custom: true
    server: true
    parallel: true
    structuredOutput: true
    supported: [function_calling, web_search, web_search_premium, document_library, code_interpreter, image_generation]
  modalities:
    input: [text, image, pdf, document]
    output: [text]
  parameters:
    chat_completions: [model, messages, temperature, top_p, max_tokens, stream, stop, random_seed, metadata, response_format, tools, tool_choice, presence_penalty, frequency_penalty, n, parallel_tool_calls, prompt_mode, guardrails, prompt_cache_key, safe_prompt]
    conversations: [model, inputs, stream, tools, completion_args]
    agents: [model, name, description, instructions, tools, completion_args, handoffs]
    files: [file, purpose, file_name]
    batches: [endpoint, input_files, requests, model, agent_id, metadata, timeout_hours]
  batch:
    eligible: true
    discounted: true
    supportedEndpoints: [chat_completions, conversations]
    maxRequestBytes: 536870912
  limits:
    contextWindow: 262144
    maxOutputTokens: 0
    messagesBytes: 33554432
    batchBytes: 536870912
    fileBytes: 536870912
