  endpoints: [ocr, files, batches]
  transports: [http]
  lifecycle: active
  thinking:
    defaultMode: disabled
    allowedModes: [disabled]
  assistantPrefill: false
  sampling:
    parameters: []
  tools:
    custom: false
    parallel: false
    structuredOutput: true
  modalities:
    input: [image, pdf, document]
    output: [text, document]
  parameters:
    ocr: [model, document, pages, include_image_base64, image_limit, image_min_size, bbox_annotation_format, document_annotation_format, document_annotation_prompt, table_format, extract_header, extract_footer, include_blocks, confidence_scores_granularity]
