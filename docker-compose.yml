services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: model_discovery
      SUPPORT_ADMIN_DB_PASSWORD: ${SUPPORT_ADMIN_DB_PASSWORD:-local-support-admin-only}
    ports:
      - '5432:5432'
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/compose/postgres/initdb/02-create-support-admin.sh:/docker-entrypoint-initdb.d/02-create-support-admin.sh:ro

  redis:
    image: redis:7
    ports:
      - '6379:6379'

  typesense:
    image: typesense/typesense:29.1
    command: '--data-dir /data --api-key=xyz --enable-cors'
    ports:
      - '8108:8108'
    volumes:
      - typesense_data:/data

  backend:
    build:
      context: .
      dockerfile: apps/model-discovery/Dockerfile
    environment:
      PORT: 3002
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/model_discovery?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      TYPESENSE_HOST: typesense
      TYPESENSE_PORT: 8108
      TYPESENSE_PROTOCOL: http
      TYPESENSE_API_KEY: xyz
      TYPESENSE_COLLECTION_MODELS: models
      TYPESENSE_READS_ENABLED: "true"
      TYPESENSE_READY_STRICT: "true"
    depends_on:
      - postgres
      - redis
      - typesense
    ports:
      - '3002:3002'

  model-discovery-web:
    build:
      context: .
      dockerfile: apps/model-discovery-web/Dockerfile
    environment:
      MODEL_DISCOVERY_API_BASE_INTERNAL: http://backend:3002/api/v1
      SHAHRAH_CONTROL_PLANE_URL: ${SHAHRAH_CONTROL_PLANE_URL:-http://host.docker.internal:4000}
    depends_on:
      - backend
    ports:
      - '3003:3000'

  support-admin:
    build:
      context: .
      dockerfile: apps/support-admin/Dockerfile
    env_file:
      - path: ./apps/support-admin/.env
        required: false
    environment:
      MODEL_DISCOVERY_API_BASE_INTERNAL: http://backend:3002/api/v1
      DATABASE_URL: postgresql://support_admin:${SUPPORT_ADMIN_DB_PASSWORD:-local-support-admin-only}@postgres:5432/support_admin?schema=public
      SHAHRAH_CONTROL_PLANE_URL: ${SHAHRAH_CONTROL_PLANE_URL:-http://127.0.0.1:4000}
      SUPPORT_ADMIN_ORIGIN: ${SUPPORT_ADMIN_ORIGIN:-http://localhost:3001}
    depends_on:
      - backend
    ports:
      - '3001:3000'

  support-admin-migrate:
    build:
      context: .
      dockerfile: apps/support-admin/Dockerfile
      target: migrate
    command: ["pnpm", "exec", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://support_admin:${SUPPORT_ADMIN_DB_PASSWORD:-local-support-admin-only}@postgres:5432/support_admin?schema=public
    depends_on:
      - postgres

volumes:
  pg_data:
  typesense_data:
